<style>
  /* ===== Design tokens: base colors + light/pink themes ===== */
  :root{
    --bg:#0f1420; --card:#1a2233; --card2:#20293d; --text:#eef2f8; --muted:#8a93a6;
    --green:#3ecf8e; --yellow:#f2b84b; --orange:#dd8a4f; --red:#e5645a; --red-soft:#eb8478; --accent:#5b8cff; --border:#2a3348; --track:#0c1120;
    color-scheme: dark;
  }
  /* Light theme — clean, bright, high-contrast on white. */
  :root[data-theme="light"]{
    --bg:#f5f7fb; --card:#ffffff; --card2:#eef1f7; --text:#1a2233; --muted:#5c6577;
    --green:#2fa876; --yellow:#c98a1f; --orange:#c06d24; --red:#d1483f; --red-soft:#e06860; --accent:#3b6fe0; --border:#dbe1ea; --track:#e4e9f2;
    color-scheme: light;
  }
  /* Pink theme — soft pastel pink palette. */
  :root[data-theme="pink"]{
    --bg:#fff0f5; --card:#ffffff; --card2:#ffe4ef; --text:#5a2340; --muted:#a1657f;
    --green:#3ecf9e; --yellow:#e0a23f; --orange:#e08a55; --red:#e0567e; --red-soft:#ef7d9f; --accent:#ff6fa5; --border:#f6c9dd; --track:#ffe0ec;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html{
    /* Matches the body gradient's darkest tone so iOS/Android overscroll bounce (dragging past
       the top/bottom/sides in the installed PWA) reveals this instead of the browser's white
       default canvas. */
    background:#0b0e17;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  html[data-theme="light"]{ background:#f5f7fb; }
  html[data-theme="pink"]{ background:#fff0f5; }
  /* ===== Page shell ===== */
   body{
     margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
     background:linear-gradient(160deg,#0b0e17,#141b2c 60%,#0f1420); color:var(--text); min-height:100vh;
     overscroll-behavior:none; overflow-x:hidden;
     /* A double-tap must never zoom the page. It did: the app widened and ran off both edges, so
        a stray double-tap left the user in a zoomed-in view with no way back except pinching.
        `manipulation` keeps panning AND deliberate pinch-zoom (accessibility — someone with low
        vision can still zoom on purpose) but takes the accidental double-tap zoom away, and as a
        bonus removes the 300ms tap delay, so the PWA feels like a real app. The value is
        intersected down the DOM: the drag handle (touch-action:none) and the cards (pan-y) keep
        their own behaviour, nothing gets pan-locked. */
     touch-action:manipulation;
     /* viewport-fit=cover lets the page use the full screen in an installed PWA, but then the
        notch / home-indicator area overlaps the content. These insets reserve it, so the header
        and the bottom of the list are never clipped or half-hidden ("шапка съезжает"). */
     padding-left:env(safe-area-inset-left);
     padding-right:env(safe-area-inset-right);
   }
    /* Top/bottom insets only matter where the system UI actually overlaps (a standalone PWA);
       in a plain browser tab env() resolves to 0 and the page is unchanged. */
    @media (display-mode: standalone){
      body{ padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
      /* The standalone account button shows only the user icon (the name lives in its data-tip
         bubble, since a native title never appears on touch) — give the glyph a proper size. */
      #btnAccount{min-width:34px; padding:6px 10px; font-size:18px; display:inline-flex; align-items:center; justify-content:center;}
      /* Motivation line: at the full 18px a quote does not fit the narrow standalone width —
         smaller font here, and the field itself is a <textarea>, so a long quote wraps to a
         second line instead of being cut off (see .quote-input). */
      .quote-input{font-size:14px;}
      /* A long press in the installed app must NOT open the copy/paste menu: on a phone that
         gesture is easy to fire by accident while scrolling, and a native app never offers it for
         chrome text. `-webkit-touch-callout:none` is the iOS half (it kills the native callout);
         `user-select:none` disables selection so there is nothing to copy in the first place.
         Real fields exempt themselves below — selecting your own goal text there must stay
         possible. Scoped to the standalone PWA on purpose: in a browser tab text selection is a
         normal, useful browser feature. */
      body{ user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
      input, textarea{ user-select:text; -webkit-user-select:text; -webkit-touch-callout:default; }
    }
  html[data-theme="light"] body{ background:linear-gradient(160deg,#f5f7fb,#eef1f7 60%,#f5f7fb); }
  html[data-theme="pink"] body{ background:linear-gradient(160deg,#fff0f5,#ffe4ef 60%,#fff5f9); }
  #app{max-width:920px; margin:0 auto; padding:28px 20px 80px;}
  /* ===== Topbar: menus, language & theme switchers ===== */
  .topbar{display:flex; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .app-title-wrap{display:flex; flex-direction:column; gap:0; line-height:1.2;}
  .topbar h1{font-size:20px; margin:0; font-weight:600; display:flex; align-items:center; gap:8px;}
  .app-logo{width:26px; height:26px; border-radius:50%; flex:none; display:block;}
  .app-subtitle{font-size:12px; color:var(--muted); font-weight:400;}
  /* margin-left:auto (rather than justify-content:space-between on .topbar) so this stays pinned
     to the right edge even after it wraps onto its own line below a long title on narrow screens —
     with space-between, a lone wrapped item sits at the START of its line (the left edge) instead. */
  .actions{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto;}
  /* Scoped to .topbar (not .actions) because #btnTopMenu/.lang-menu now live in their own
     .top-menu-dropdown wrapper, a sibling of .actions rather than a descendant of it — .topbar is
     the nearest ancestor shared by both, so this still styles the account button AND the ☰ button. */
  .topbar button{
    background:var(--card2); color:var(--muted); border:1px solid var(--border); border-radius:8px;
    padding:6px 12px; font-size:12px; cursor:pointer;
  }
  /* Hover feedback is for REAL pointers only. On touch, WebKit deliberately keeps :hover sticky
     after a tap (the note at [data-tip] below explains why), so the last-tapped control keeps its
     hover look forever — that is the «↕ в PWA голубая, в вебе нормально» report: an accent border
     that never goes away. Gating on (hover: hover) AND (pointer: fine) means a phone or tablet
     (coarse pointer — and iOS, where (hover: none) is not reliable) never paints these rules at
     all, so there is nothing left to stick. A mouse-driven desktop keeps the feedback. */
  @media (hover: hover) and (pointer: fine){
    .topbar button:hover{color:var(--text); border-color:var(--accent);}
  }
  #btnTopMenu{padding:1px 2px !important; font-size:24px !important; line-height:1; display:flex; align-items:center; justify-content:center; border-color:transparent;}
  /* z-index:11 keeps the button (and its open dropdown) above .menu-backdrop (z-index:9) once
     the menu is open — it now sits in the top-left corner instead of inside .actions. */
  .top-menu-dropdown{position:relative; display:inline-flex; z-index:11;}
  .lang-menu{
    position:absolute; top:calc(100% + 6px); left:0; background:var(--card2); border:1px solid var(--border);
    border-radius:12px; padding:6px; display:flex; flex-direction:column; gap:2px; z-index:10; width:max-content;
    max-width:calc(100vw - 32px); box-shadow:0 12px 28px rgba(0,0,0,.4);
  }
  /* Dims the rest of the page while the ☰ menu is open. Purely visual — the existing
     document-level click-away listener already closes the menu on any outside click, and since
     this sits above everything but below the dropdown itself, that click naturally lands on the
     backdrop (not on a card behind it) and still bubbles up to close the menu as before. */
  .menu-backdrop{position:fixed; inset:0; background:rgba(6,9,16,0.6); z-index:9;}
  .topbar .lang-option{
    background:none; border:1px solid transparent; border-radius:8px; padding:4px; font-size:20px;
    line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .topbar .lang-option:hover{background:var(--card); border-color:var(--border);}
  .topbar .lang-option.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .topbar .menu-item{
    background:none; border:none; color:var(--text); border-radius:8px; padding:8px; font-size:13px;
    cursor:pointer; text-align:left; white-space:normal; word-break:break-word;
  }
   .topbar .menu-item:hover{background:var(--card);}
  /* Same horizontal padding (8px) as .menu-item above, so the flag/theme rows line up flush with
     the text items instead of sitting slightly indented relative to them. */
  .menu-lang-row{display:flex; gap:4px; justify-content:flex-start; padding:8px 8px 0; margin-top:4px; border-top:1px solid var(--border);}
  .menu-theme-row{display:flex; gap:4px; justify-content:flex-start; padding:8px 8px 4px; margin-top:4px; border-top:1px solid var(--border);}
  .topbar .theme-option{
    background:none; border:1px solid transparent; border-radius:8px; padding:4px; font-size:18px;
    line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .topbar .theme-option:hover{background:var(--card); border-color:var(--border);}
  .topbar .theme-option.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
   /* The top-right trio — ☰ menu, search, account — ONE box, ONE glyph size, ONE border.
      Before this they were three different controls in the same corner: ☰ at 24px with a
      transparent border, search 16px inside a 32px box, account 18px inside a 34px box, so the
      installed PWA looked scruffy next to the rest of the site. Applies to the installed PWA and
      to any narrow screen (a phone browser gets the same tidy corner). */
   @media (display-mode: standalone), (max-width:480px){
     #btnTopMenu, #btnSearch, .account-dropdown #btnAccount{
       min-width:38px; height:38px; padding:0; font-size:20px; border-radius:8px;
       display:inline-flex; align-items:center; justify-content:center; border-color:var(--border);
     }
     /* #btnTopMenu's base rule pins padding/font-size with !important — answer in kind, or the
        trio would still sit in three different boxes. */
     #btnTopMenu{ padding:0 !important; font-size:20px !important; }
   }
  /* ===== Action buttons (edit/delete/move/relocate/archive) ===== */
   #btnEdit, #btnDelete, #btnAddSubgoal, #btnDeleteChecklist, #btnMove, #btnMoveChecklist, #btnRelocate, #btnChecklistAdd, #btnFilter, .add-child-row #btnArchive, .add-goal-wrap #btnArchive, #btnGoodTodayHistory, #btnGoodTodayWeekHistory, #btnGoodTodayWeekEdit, #btnWishManage, #btnWishGrid, #btnWishPrint, #btnWheelPrint, #btnGoodTodayHistoryPagePrev, #btnGoodTodayHistoryPageNext, #btnGoodTodayHistoryPagePrevBottom, #btnGoodTodayHistoryPageNextBottom{
    background:var(--card2); border:1px solid var(--border); color:var(--muted); border-radius:8px;
    padding:6px 12px; font-size:12px; cursor:pointer; white-space:nowrap;
  }
   /* Hover feedback is for REAL pointers only — same rule and the same reason as the .topbar one
      above: on touch the hover look sticks after a tap, which is what made «↕» (and every other
      action button) look permanently blue in the installed PWA while the web version looked
      normal. A coarse pointer (touch/pen — and iOS, where (hover: none) does not reliably match)
      never paints these, so nothing can stick; a mouse keeps the feedback. The REAL mode colours
      (.active rules) are deliberately OUTSIDE this gate: they signal a working mode. */
   @media (hover: hover) and (pointer: fine){
     #btnFilter:hover,#btnGoodTodayHistory:hover,#btnGoodTodayWeekHistory:hover,#btnGoodTodayWeekEdit:hover,#btnGoodTodayHistoryPagePrev:hover,#btnGoodTodayHistoryPageNext:hover,#btnGoodTodayHistoryPagePrevBottom:hover,#btnGoodTodayHistoryPageNextBottom:hover{color:var(--text); border-color:var(--accent);}
     #btnEdit:hover{color:var(--text); border-color:var(--accent);}
     #btnDelete:hover{border-color:var(--red); color:var(--red);}
     #btnDeleteChecklist:hover{border-color:var(--red); color:var(--red);}
     #btnMove:hover, #btnMoveChecklist:hover{color:var(--text); border-color:var(--accent);}
     #btnAddSubgoal:hover{color:var(--text); border-color:var(--accent);}
     #btnRelocate:hover{color:var(--text); border-color:var(--accent);}
      .add-child-row #btnArchive:hover, .add-goal-wrap #btnArchive:hover{color:var(--text); border-color:var(--accent);}
      .sphere-reminder-actions button:not(.sphere-reminder-open):hover{border-color:var(--accent);}
      .wheel-sector-hit:hover{fill:var(--accent); fill-opacity:.10;}
      .sphere-tree-item:hover{border-color:var(--accent);}
      .sphere-tree-close:hover{color:var(--text); border-color:var(--accent);}
    }
   /* The REAL mode colours: OUTSIDE the gate on purpose — they signal a working mode (move /
      delete / rename), not a hover affordance, and a touch user must see them just like a mouse
      user does. They use .active, never :hover, so the sticky-hover problem cannot touch them. */
   #btnEdit.active{background:var(--accent); color:#fff; border-color:var(--accent);}
   #btnDelete.active{background:var(--red); color:#fff; border-color:var(--red);}
   #btnMove.active, #btnMoveChecklist.active{background:var(--accent); color:#fff; border-color:var(--accent);}
   #btnAddSubgoal.active{background:var(--accent); color:#fff; border-color:var(--accent);}
   #btnRelocate.active{background:var(--accent); color:#fff; border-color:var(--accent);}
   .add-child-row #btnArchive.active, .add-goal-wrap #btnArchive.active{background:var(--accent); color:#fff; border-color:var(--accent);}
   /* Touch has no hover to LEAVE: after a tap a button stays stuck in :hover, and the accent
      border + brighter glyph make the «↕» reorder button in «Важные сферы жизни» look blue —
      different from the web version, where hover ends when the mouse moves away. Neutralize the
      stuck hover on a touch-only standalone PWA; a desktop-installed PWA driven by a mouse keeps
      normal hover feedback. `:not(.active)` keeps the REAL mode colours (move / delete / rename)
      visible — they signal an active mode and must not be washed out.
      The condition is a LIST on purpose: `hover: none` alone is not enough, because iOS reports
      `hover: hover` (it emulates a mouse) while still making :hover sticky after a tap — which is
      exactly why the earlier hover:none-only rule never fired on the owner's iPhone and «↕» stayed
      blue. `pointer: coarse` is the part that actually matches every touch device. The action
      buttons above are additionally gated behind (hover: hover) and (pointer: fine), so this is
      the second line of defence rather than the only one. */
   @media (display-mode: standalone) and (hover: none), (display-mode: standalone) and (pointer: coarse){
     .topbar button:hover{color:var(--muted); border-color:var(--border);}
     #btnEdit:hover:not(.active), #btnDelete:hover:not(.active), #btnMove:hover:not(.active),
     #btnMoveChecklist:hover:not(.active), #btnAddSubgoal:hover:not(.active),
      #btnRelocate:hover:not(.active), #btnFilter:hover, #btnAddGoal:hover:not(.active),
      #btnTemplates:hover:not(.active), #btnAddChild:hover:not(.active), #btnChecklistAdd:hover, #btnWishAdd:hover, #btnWishManage:hover,
     #btnWishGrid:hover, #btnWishPrint:hover, #btnWheelPrint:hover,
      #btnGoodTodayAdd:hover, .add-child-row #btnArchive:hover:not(.active),
      .add-goal-wrap #btnArchive:hover:not(.active){color:var(--muted); border-color:var(--border);}
    }

    /* Третья линия обороны — тач вообще (репорт 11.10.2026: «↕ снова голубая в
       PWA»). iOS рапортует hover:hover в паре с pointer:fine, поэтому гейт
       hover-правил выше СРАБАТЫВАЕТ, а глушение по pointer:coarse — нет:
       WebKit оставляет :hover после тапа, кнопка светится акцентом постоянно.
       Документ помечается на первом touchstart (см. конец скрипта), и ховеры
       глушатся классом независимо от того, что рапортует устройство. Цвета
       режимов (.active) вне списка — тач-пользователь их по-прежнему видит. */
    .touch-mode #btnEdit:hover:not(.active), .touch-mode #btnDelete:hover:not(.active),
    .touch-mode #btnMove:hover:not(.active), .touch-mode #btnMoveChecklist:hover:not(.active),
    .touch-mode #btnAddSubgoal:hover:not(.active), .touch-mode #btnRelocate:hover:not(.active),
     .touch-mode #btnFilter:hover, .touch-mode #btnAddGoal:hover:not(.active),
     .touch-mode #btnTemplates:hover:not(.active),
     .touch-mode #btnAddChild:hover:not(.active), .touch-mode #btnChecklistAdd:hover,
    .touch-mode #btnWishAdd:hover, .touch-mode #btnWishManage:hover,
    .touch-mode #btnWishGrid:hover, .touch-mode #btnWishPrint:hover, .touch-mode #btnWheelPrint:hover,
    .touch-mode #btnGoodTodayAdd:hover,
    .touch-mode #btnGoodTodayHistory:hover, .touch-mode #btnGoodTodayWeekHistory:hover,
    .touch-mode #btnGoodTodayWeekEdit:hover,
    .touch-mode #btnGoodTodayHistoryPagePrev:hover, .touch-mode #btnGoodTodayHistoryPageNext:hover,
    .touch-mode #btnGoodTodayHistoryPagePrevBottom:hover, .touch-mode #btnGoodTodayHistoryPageNextBottom:hover,
    .touch-mode .add-child-row #btnArchive:hover:not(.active),
    .touch-mode .add-goal-wrap #btnArchive:hover:not(.active),
    .touch-mode .topbar button:hover,
    .touch-mode .goal-row .actions button:hover{color:var(--muted); border-color:var(--border);}
    // Мягкое напоминание: у его второй кнопки hover меняет только рамку, поэтому в тач-режиме
    // гасим именно её (акцентная кнопка «Открыть сферу» вне списка — её цвет не ховерный).
    .touch-mode .sphere-reminder-actions button:not(.sphere-reminder-open):hover{border-color:var(--border);}
    // Тач-режим гасит и ховеры нового колеса/панели: сектор, строки дерева и кнопка «Свернуть».
    .touch-mode .wheel-sector-hit:hover{fill-opacity:0;}
    .touch-mode .sphere-tree-item:hover{border-color:var(--border);}
    .touch-mode .sphere-tree-close:hover{color:var(--text); border-color:var(--border);}
  .edit-hint{color:var(--muted); font-weight:400; font-size:12px;}
  .edit-hint.delete-hint{color:var(--red);}
  /* ===== Modal overlays & panels (auth, install, about, confirm) ===== */
  .auth-modal-overlay{
    position:fixed; inset:0; background:rgba(6,9,16,0.6); display:flex; align-items:center;
    justify-content:center; padding:20px; z-index:50;
  }
  .auth-panel{
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px 20px 18px;
    display:flex; flex-direction:column; gap:10px; width:100%; max-width:340px; position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  /* For panels with long content (the usage instructions) — without this, a modal taller than the
     viewport just overflows past the screen edge with no way to scroll to the rest of it. */
  .auth-panel.scrollable{max-height:calc(100vh - 40px); overflow-y:auto;}
  .auth-panel.wide{max-width:460px;}
  .auth-panel button.auth-close{
    position:absolute; top:8px; right:8px; background:none; border:none; color:var(--muted);
    font-size:18px; cursor:pointer; line-height:1; padding:6px; flex:none;
  }
  .auth-panel button.auth-close:hover{color:var(--text);}
  /* Templates modal panel */
  .auth-panel.templates-panel{max-width:420px;}
  .templates-list{display:flex; flex-direction:column; gap:8px;}
  .template-item{display:flex; align-items:flex-start; gap:12px; padding:10px 12px; background:var(--card2); border:1px solid var(--border); border-radius:10px; cursor:pointer; transition:background .15s, border-color .15s;}
  .template-item:hover{background:var(--card); border-color:var(--accent);}
  .template-item input[type="checkbox"]{flex:none; margin-top:2px; width:18px; height:18px; accent-color:var(--accent);}
  .template-info{flex:1; min-width:0;}
  .template-info strong{display:block; font-size:14px; color:var(--text); margin-bottom:2px;}
  .template-desc{font-size:12px; color:var(--muted);}
  .templates-preview{margin-top:12px; padding-top:10px; border-top:1px solid var(--border);}
  .templates-preview strong{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .templates-preview ul{margin:0; padding-left:16px;}
  .templates-preview li{font-size:13px; color:var(--text); margin:2px 0;}
  .templates-preview li > li{margin:2px 0 0 16px; font-size:12px; color:var(--muted);}
  .template-merge-note{font-size:11px; color:var(--muted);}
  .templates-panel .auth-btn-row{margin-top:8px;}
  .auth-panel input{
    background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:9px 10px; font-size:16px; outline:none; width:100%;
  }
  .auth-panel input:focus{border-color:var(--accent);}
  .auth-panel input.input-error{border-color:var(--red); box-shadow:0 0 0 1px var(--red);}
  .auth-panel .auth-btn-row{display:flex; align-items:center; justify-content:space-evenly; gap:8px;}
  .auth-panel .auth-btn-row button{flex:none;}
  /* For buttons whose label is too long to sit side-by-side without overflowing a narrow (PWA)
     screen — e.g. the sync-conflict resolution buttons — stack full-width instead of forcing a
     nowrap row that spills past the panel/viewport edge. */
  .auth-panel .auth-btn-col{display:flex; flex-direction:column; gap:8px;}
  .auth-panel .auth-btn-col button{flex:none; width:100%; white-space:normal; text-align:center; line-height:1.4;}
  .auth-signup-row{display:flex; justify-content:center;}
  .auth-signup-row button{flex:none; min-width:160px;}
  .auth-panel button{
    background:var(--card2); border:1px solid var(--border); color:var(--muted); border-radius:8px;
    padding:9px 14px; font-size:12px; cursor:pointer; white-space:nowrap; flex:1;
  }
  .auth-panel button:hover{color:var(--text); border-color:var(--accent);}
  .auth-panel button.btn-danger{color:var(--red); border-color:var(--red); background:rgba(229,100,90,0.14);}
  .auth-panel button.btn-danger:hover{background:rgba(229,100,90,0.24); border-color:var(--red);}
  .auth-panel button:disabled{opacity:.5; cursor:not-allowed;}
  .auth-error{color:var(--red); font-size:12px;}
  .auth-hint{color:var(--muted); font-size:12px;}
  .auth-hint.valid{color:var(--green);}
  .install-steps{color:var(--text); font-size:13px; line-height:1.6;}
  .install-steps ol{margin:0; padding-left:20px;}
  .install-steps li{margin-bottom:8px;}
  .install-steps li:last-child{margin-bottom:0;}
  .about-text{color:var(--text); font-size:13px; line-height:1.6; white-space:pre-line;}
  /* Global search results: a vertical stack of tappable rows inside the search panel. Scoped under
     .auth-panel so it wins over the generic `.auth-panel button` rule (specificity 0,2,0 > 0,1,1). */
  .search-results{display:flex; flex-direction:column; gap:6px; margin-top:2px;}
  .auth-panel .search-result{
    background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:9px 10px; font-size:13px; cursor:pointer; text-align:left; line-height:1.3;
    flex:none; white-space:normal;
  }
  .auth-panel .search-result:hover{border-color:var(--accent);}
  .auth-panel .search-result.archived{opacity:.5;}
  .search-kind{color:var(--muted); margin-right:6px;}
  .auth-link{
    background:none; border:none; color:var(--accent); font-size:12px; padding:0;
    cursor:pointer; text-align:right; align-self:auto;
  }
  /* Scoped to .auth-panel (raising specificity above the plain ".auth-panel button" rule, which
     sets white-space:nowrap for every button in a panel) — without this override, a longer link
     like "Скачать резервную копию сначала" refuses to wrap and its last word spills off the edge
     of a narrow (PWA) screen instead of wrapping onto a second line. */
  .auth-panel .auth-link-center{
    background:none; border:none; color:var(--accent); font-size:12px; padding:4px 0;
    cursor:pointer; text-align:center; width:100%; flex:none; white-space:normal; line-height:1.4;
  }
  .auth-link:disabled{opacity:.5; cursor:not-allowed;}
  .auth-consent{display:flex; align-items:flex-start; gap:8px; font-size:12px; color:var(--muted); cursor:pointer; line-height:1.4;}
  .auth-consent input[type=checkbox]{width:16px; height:16px; flex:none; margin-top:1px; accent-color:var(--accent); cursor:pointer;}
  .auth-consent-details{margin-top:4px;}
  .auth-consent-details summary{color:var(--accent); cursor:pointer; display:inline;}
  .auth-consent-details[open] summary{margin-bottom:4px; display:block;}
  .account-dropdown{position:relative; display:inline-flex; z-index:11;}
  .account-menu{
    position:absolute; top:calc(100% + 4px); right:0; background:var(--card2); border:1px solid var(--accent);
    border-radius:10px; padding:4px; display:flex; flex-direction:column; gap:2px; z-index:10;
    width:max-content; max-width:calc(100vw - 32px); box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .account-menu button{
    background:none; border:none; color:var(--text); border-radius:6px; padding:9px 12px; font-size:13px;
    cursor:pointer; text-align:left; white-space:nowrap;
  }
  .account-menu button:hover{background:var(--card);}
  .account-menu button.danger{color:var(--red);}
  /* Home goals sort dropdown — opened by the #btnFilter button next to reorder. Mirrors
     .account-menu styling; options get a check mark when active. */
  .filter-dropdown{position:relative; display:inline-flex; z-index:11;}
  .filter-menu{
    position:absolute; top:calc(100% + 4px); right:0; background:var(--card2); border:1px solid var(--border);
    border-radius:10px; padding:4px; display:flex; flex-direction:column; gap:2px; z-index:10;
    min-width:180px; box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .filter-menu button{
    background:none; border:none; color:var(--text); border-radius:6px; padding:9px 12px; font-size:13px;
    cursor:pointer; text-align:left; white-space:nowrap; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .filter-menu button:hover{background:var(--card);}
  .filter-menu button.active{color:var(--accent); font-weight:600;}
  .filter-menu button.active::after{content:'✓';}
  .verify-banner{
    display:flex; align-items:center; flex-wrap:wrap; gap:8px; background:rgba(230,180,60,.12);
    border:1px solid var(--yellow); color:var(--text); border-radius:10px; padding:8px 12px;
    font-size:12px; margin:0 0 12px;
  }
  .verify-banner button{
    background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:5px 10px; font-size:12px; cursor:pointer; white-space:nowrap;
  }
  .verify-banner button:hover{background:var(--card);}
  .verify-banner button:disabled{opacity:.5; cursor:not-allowed;}
  .verify-msg{color:var(--muted);}
  .edit-account-panel{max-width:380px;}
  .field-label{color:var(--muted); font-size:12px; margin-bottom:-4px;}
  .auth-panel select{
    background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:9px 10px; font-size:16px; outline:none; width:100%;
  }
  /* ===== Breadcrumb & relocate picker ===== */
  .breadcrumb-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .breadcrumb{display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--muted);}
  .breadcrumb span.crumb{cursor:pointer; padding:3px 8px; border-radius:6px;}
  .breadcrumb span.crumb:hover{background:var(--card2); color:var(--text);}
  .breadcrumb span.sep{opacity:.4;}
  .back-btn{
    background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:5px 12px; font-size:13px; cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  .back-btn:hover{border-color:var(--accent);}
  .relocate-source-name{font-size:13px; color:var(--muted);}
  .relocate-breadcrumb{display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--muted); padding:8px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
  .relocate-breadcrumb .relocate-crumb{cursor:pointer; padding:3px 6px; border-radius:6px;}
  .relocate-breadcrumb .relocate-crumb:hover{background:var(--card2); color:var(--text);}
  .relocate-breadcrumb .sep{opacity:.4;}
  .relocate-list{display:flex; flex-direction:column; gap:6px; max-height:240px; overflow-y:auto;}
  /* Scoped to .auth-panel (raising specificity above the plain ".auth-panel button" rule, which
     otherwise forces white-space:nowrap + flex:1 on every button in a panel) so long goal names
     wrap onto a second line instead of spilling off the edge — same pattern as .auth-link-center. */
  .auth-panel .relocate-row{
    background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:9px 12px; font-size:13px; cursor:pointer; text-align:left; white-space:normal; flex:none; width:100%;
  }
  .auth-panel .relocate-row:hover{border-color:var(--accent); color:var(--accent);}
  .auth-panel .relocate-here-btn{
    background:var(--accent); border:1px solid var(--accent); color:#fff; font-weight:600;
    white-space:normal; flex:none; width:100%;
  }
  .auth-panel .relocate-here-btn:hover{opacity:.9; border-color:var(--accent);}
  /* ===== Home: overall progress & priority block ===== */
  .overall{
    background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 22px; margin-bottom:22px;
  }
  .overall .row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .overall h2{margin:0; font-size:16px; font-weight:600; color:var(--muted);}
  .overall .pct{font-size:28px; font-weight:700;}
  .priority-block{
    background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px; margin-bottom:22px;
  }
  .priority-header{display:flex; align-items:center; cursor:pointer; user-select:none;}
  .priority-header .section-title{margin:0;}
  .priority-arrow{color:var(--muted); font-size:13px; margin-right:6px;}
  .priority-list{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  /* Without this, iOS/PWA taps on the checkbox and name go through the browser's default
     double-tap-zoom disambiguation delay (~300ms) before the click actually fires — by then the
     row's own re-render from a nearby interaction may already have shifted layout slightly, so the
     delayed click can land on the wrong row, or fire a second time on the same box and immediately
     re-toggle it back off. `.card[data-nav]` already uses the pan-y variant of this fix for the
     goal cards; priority rows have no drag gesture to preserve, so manipulation (which drops
     double-tap-zoom but keeps ordinary scrolling) is enough here. */
  .priority-row{display:flex; align-items:center; gap:12px; touch-action:manipulation;}
  .priority-row .chk{margin-top:0;}
  .priority-name{flex:1; font-size:14px; line-height:1.4; cursor:pointer; min-width:0; overflow-wrap:break-word; word-break:break-word;}
  .priority-name:hover{color:var(--accent);}
  .priority-name.done{color:var(--muted); text-decoration:line-through;}
  .priority-date{font-size:12px; color:var(--muted); white-space:nowrap; flex-shrink:0;}
  .priority-remove{
    background:none; border:none; color:var(--muted); font-size:14px; line-height:1; cursor:pointer;
    padding:2px; flex-shrink:0;
  }
  .priority-remove:hover{color:var(--red);}
  /* ===== Leaf detail: title, stars, bars, node header ===== */
  .leaf-title-row{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .leaf-title-row .leaf-title{min-width:0; overflow-wrap:break-word; word-break:break-word;}
  .star-btn{
    background:none; border:none; color:var(--muted); font-size:18px; line-height:1; cursor:pointer;
    padding:0; flex-shrink:0;
  }
  .star-btn:hover{color:var(--yellow);}
  .star-btn.active{color:var(--yellow);}
  /* Archive uses its own color (not the priority star's yellow) so the two toggles read as
     distinct actions even though they share the same button styling. */
  #btnArchive:hover{color:var(--accent);}
  #btnArchive.active{color:var(--accent);}
   .checklist-star{font-size:15px;}
   /* «Хорошее сегодня» journal module — styled like «Карта желаний» (same .section-title-row /
      .wheel-arrow / .icon-btn language), no card wrapper — content renders directly under the header. */
    .good-today-subtitle{color:var(--muted); font-size:13px; margin:0 0 10px;}
    .good-today-subtitle-row{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; margin:0 0 10px;
    }
    .good-today-subtitle-row .good-today-subtitle{margin:0;}
    #btnGoodTodayCalendar.icon-btn{
      background:var(--card2); border:1px solid var(--border); color:var(--muted); border-radius:8px;
      padding:4px; min-width:32px; font-size:14px; cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center;
    }
    #btnGoodTodayCalendar.icon-btn:hover{color:var(--text); border-color:var(--accent);}
    /* Native date picker (jump-to-date in history) — themed, not browser-white. */
    #goodTodayDatePicker{
      position:absolute; z-index:60; top:0; left:0;
      background:var(--card2); color:var(--text);
      border:1px solid var(--border); border-radius:10px;
      padding:8px 10px; font-size:14px; font-family:inherit;
      color-scheme:inherit;
    }
   .good-today-textarea{
     width:100%; min-height:72px; resize:vertical;
     background:var(--card2); border:1px solid var(--border); border-radius:10px;
     padding:10px 12px; font-size:14px; line-height:1.4; color:var(--text);
     font-family:inherit; box-sizing:border-box;
   }
   .good-today-textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
   .good-today-char-count{color:var(--muted); font-size:12px; text-align:right; margin-top:6px;}
   .good-today-char-count.error{color:var(--red);}
    .good-today-btn-row{
      display:flex; gap:10px; margin-top:10px;
    }
    .good-today-btn-row button{
      flex:1; min-height:44px; padding:10px 12px; border-radius:10px; cursor:pointer;

      background:var(--card2); color:var(--text);
    }
     .good-today-btn-row button.good-today-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
     .good-today-history-nav button{
       flex:1; min-height:24px; padding:4px 12px; border-radius:10px; cursor:pointer;
       font-size:13px; font-weight:600; border:1px solid var(--border);
       background:var(--card2); color:var(--text);
     }
     .good-today-history-nav button.good-today-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
     .good-today-history-nav .icon-btn{
       flex:none; width:36px; height:36px; min-width:36px; padding:6px;
       border-radius:10px; border:1px solid var(--border); background:var(--card2); color:var(--muted);
       cursor:pointer; font-size:13px; display:inline-flex; align-items:center; justify-content:center;
     }
     .good-today-history-nav .icon-btn:hover{color:var(--text); border-color:var(--accent);}
     /* Мягкое напоминание о сфере («К сфере … давно не возвращались»). Ненавязчивая карточка
        над «Важными сферами жизни»: тёмная тема, светлая и розовая — всё на переменных, без

     .sphere-reminder{

       background:var(--card2); color:var(--text);
     }
     .sphere-reminder-actions button.sphere-reminder-open{background:var(--accent); border-color:var(--accent); color:#fff;}
   .good-today-today-entries{
     margin-top:12px; border-top:1px solid var(--border); padding-top:12px;
   }
   .good-today-today-entries .good-today-week-label{margin-bottom:8px;}
   .good-today-entry-item{
     border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:8px;
     background:var(--card2);
   }
   .good-today-entry-date{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
   .good-today-entry-text{font-size:14px; line-height:1.4; word-break:break-word;}
    .good-today-entry-actions{
      display:flex; gap:6px; margin-top:6px;
    }
    .good-today-entry-actions .icon-btn{
      background:var(--card2); border:1px solid var(--border); color:var(--muted); border-radius:8px;
      padding:4px; min-width:32px; font-size:14px; line-height:1; display:inline-flex; align-items:center; justify-content:center;
    }
    .good-today-entry-actions .icon-btn:hover{

   .good-today-last-entry{

   }
    .good-today-last-entry .good-today-last-text{color:var(--text); display:inline;}
    .good-today-week-saved .good-today-week-label{margin-bottom:8px;}
  /* Weekly Q&A: the question is the prominent line (full text colour, semibold), the answer is
     dimmer underneath — the reverse of the original pairing, as asked. */

   .good-today-week-form .good-today-week-label{margin-bottom:4px;}

   .good-today-week-form .good-today-week-label{color:var(--text);}

    /* «Хорошее сегодня» mood badge in the today block — progressive text based on done count.

       Зелёная, когда дата = сегодня (записи правились сегодня), красная — когда даты различаются
       (в стиле капсулы «Начнём?»). Формат даты 12.10.26. */
    .today-badges{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px;}

    .bar{height:10px; border-radius:6px; background:var(--track); overflow:hidden; border:1px solid var(--border);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
  .grid-goals{grid-template-columns:repeat(2,1fr);}
  .grid-hero-first{grid-template-columns:repeat(2,1fr);}
  .grid-hero-first > *:first-child{grid-column:1 / -1;}
  /* Below this width two fixed columns get too narrow (long goal names force overflow) —
     drop to a single column per row instead, same as installed PWA / narrow phone screens. */
  @media (max-width:480px){
    .grid-goals, .grid-hero-first{grid-template-columns:1fr;}
    /* Narrow/PWA screens (installed app on a phone): the title and the three controls sit on ONE
       line at the top — title on the left, [search][account][☰] on the right. `margin-left:auto`
       on .actions pushes it AND the ☰ behind it to the right edge, so ☰ keeps the edge its
       dropdown anchors to; the title gets the flexible slot in between (flex:1 1 auto + min-width:0
       so a long title wraps instead of pushing the buttons off the row).
       The title row itself is LEFT-aligned on purpose — the owner asked for the name to always sit
       in the top-left corner, not centred.
       Two bugs fixed here at once:
        1. order/width used to target .topbar h1, but h1 is a child of .app-title-wrap — the actual
           flex item of .topbar. The wrap therefore kept order 0 and stayed FIRST, so ☰ landed in
           the middle of the row right after the title. The wrap is the element that must move.
        2. that same misplaced `h1{order:3}` reordered the wrap's OWN column: the subtitle (order 0)
           jumped ABOVE the title («описание над названием сайта»). */
    .app-title-wrap{order:1; flex:1 1 auto; min-width:0; align-items:flex-start;}
    .actions{order:2; margin-left:auto;}
    .top-menu-dropdown{order:3; margin-left:0;}
    .topbar h1{justify-content:flex-start; margin-top:2px; font-size:17px;}
    .app-subtitle{text-align:left;}
    /* ☰ now sits at the right edge, so its dropdown must anchor to that edge, not to its left. */
    .lang-menu{left:auto; right:0;}
    .account-dropdown #btnAccount{max-width:44vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .card.selectable{cursor:pointer; border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); background:rgba(91,140,255,0.14);}
  .card.selectable:hover{border-color:var(--accent); background:rgba(91,140,255,0.24);}
  .card .title{font-size:15px; font-weight:600; margin-bottom:8px; display:flex; justify-content:space-between; gap:8px;}
  /* Flex items default to min-width:auto, which refuses to shrink below the text's full
     (unwrapped) width — with a long goal name that pushes the card wider than its grid column
     and the whole layout overflows the screen. min-width:0 lets it shrink and wrap instead. */
  .card .title > span:first-child{min-width:0; overflow-wrap:break-word; word-break:break-word;}
  .card .title .arrow{color:var(--muted); font-weight:400; flex-shrink:0;}
  .card .sub{font-size:12px; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between;}
  .card .bar{margin-top:2px;}

  /* Archived goals stay visible (dimmed, not hidden) — computePercent/doneCount already leave them
     out of the rating math (see activeChildren), this is just the visual signal to match. */
  .card.archived{opacity:.45;}
  .card.archived:hover{opacity:.6;}
  .leaf-row.archived{opacity:.5;}

  /* Inline text input for the "Three important things" editable checklist — looks like plain text

  .today-input{

      /* <textarea>: inherit the app font (the UA default is monospace) and let the text wrap —
         fitQuoteInput() grows the box to 1–2 lines after each render. */
      font-family:inherit; line-height:1.3; padding:0; overflow:hidden;
   }

  /* ===== Wish map («Карта желаний») — independent vision board under the wheel ===== */
  .wish-empty{

    display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;

  .wish-print-btn{background:var(--card2); border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:5px 9px; font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; margin-top:8px; white-space:nowrap;}
  .wish-print-btn:hover{color:var(--text); border-color:var(--accent);}
  .wish-print-btn:active{background:var(--accent); color:#fff;}
  /* Columns: 1 on very narrow screens, 2 on phones (default), 3 on tablets, 4 on desktop. */
  .wish-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media (max-width:360px){ .wish-grid{grid-template-columns:1fr;} }
  @media (min-width:600px){ .wish-grid{grid-template-columns:repeat(3,1fr);} }
  @media (min-width:960px){ .wish-grid{grid-template-columns:repeat(4,1fr);} }
  /* Явный выбор плотности (кнопка в шапке доски) сильнее адаптива по ширине — но не безусловно:
     на совсем узком экране 3–4 в ряд сделали бы карточки нечитаемыми (карточка квадратная, с
     подписью), поэтому там выбор сжимается до двух. */
  .wish-grid[data-cols="2"]{grid-template-columns:repeat(2,1fr);}
  .wish-grid[data-cols="3"]{grid-template-columns:repeat(3,1fr);}
  .wish-grid[data-cols="4"]{grid-template-columns:repeat(4,1fr);}
  @media (max-width:360px){
    .wish-grid[data-cols="3"], .wish-grid[data-cols="4"]{grid-template-columns:repeat(2,1fr);}
  }
  /* Обёртка кнопки плотности — тот же приём, что у .filter-dropdown у целей: чтобы всплывающее
     меню прижалось к своей кнопке, а не к блоку. */
  /* Печать доски: кнопка-принтер собирает временный #wishPrintRoot (вне #app, чтобы рендер его не
     трогал) и зовёт window.print(). На экране узел скрыт; в печати скрывается всё приложение и
     остаётся одна страница A4 — та же матрица, что на доске. */
  @page{ size:A4 portrait; margin:10mm; }
  /* Печатный узел на экране невидим — он существует ТОЛЬКО на время печати. */
  #wishPrintRoot{display:none;
    /* Принтеры не печатают фон, пока это не попросить явно: иначе «как на экране» не получится
       и тема на бумаге потеряется (особенно тёмная). */
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  #wheelPrintRoot{display:none;
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  /* Скрывать приложение ради печати можно ТОЛЬКО внутри @media print. Без этой обёртки правило
     срабатывало сразу на экране: тап «Печать» убирал всё приложение, а печатный узел всё равно
     оставался display:none — получался пустой экран, который нельзя ни закрыть, ни отправить на
     печать (баг, присланный владельцем 11.10.2026). */
  @media print{
    body.wish-printing > *:not(#wishPrintRoot){ display:none !important; }
    #wishPrintRoot{ display:flex !important; }
    body.wheel-printing > *:not(#wheelPrintRoot){ display:none !important; }
    #wheelPrintRoot{ display:flex !important; }
  }

  /* Custom tooltip bubble for [data-tip] elements (the "Важные сферы жизни" action buttons).
      Replaces the browser's native title tooltip, which is slow, plain-styled and never shows on
      touch devices / installed PWA. The label comes from the data-tip attribute; on hover or
      keyboard focus a small bubble fades in above the control. In a standalone PWA the bubble is
      driven by the .tip-live class instead: the JS adds it on tap and removes it after 1s,
      because touch has no hover to leave and a CSS :hover bubble would hang forever. */
   [data-tip]{position:relative;}
   [data-tip]:hover::after, [data-tip]:focus-visible::after, [data-tip].tip-live::after{
    content:attr(data-tip);
    position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%);
    background:var(--card2); color:var(--text); border:1px solid var(--border);
    font-size:12px; font-weight:500; line-height:1.3; padding:5px 10px; border-radius:8px;
    /* Длинная подсказка у кнопки у самого краю вылезала за границу экрана: теперь текст
       переносится по строкам с потолком ширины, а положение пузыря у краёв двигает JS
       (positionTip → классы tip-left/tip-right), потому что центрирование над кнопкой о край
       экрана не думает. */
    white-space:normal; width:max-content; max-width:min(64vw, 240px);
    pointer-events:none; z-index:1000;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
   /* Прижатие пузыря к краю экрана: слева — к левому краю кнопки, справа — к правому. Стрелка
      едет за пузырём, чтобы она по-прежнему смотрела в кнопку. */
   [data-tip].tip-left::after{ left:0; transform:none; }
   [data-tip].tip-right::after{ left:auto; right:0; transform:none; }
   [data-tip].tip-left::before{ left:12px; transform:none; }
   [data-tip].tip-right::before{ left:auto; right:12px; transform:none; }
   [data-tip]:hover::before, [data-tip]:focus-visible::before, [data-tip].tip-live::before{
    content:''; position:absolute; left:50%; bottom:calc(100% + 2px); transform:translateX(-50%);
    border:6px solid transparent; border-top-color:var(--border);
    pointer-events:none; z-index:1000;
  }
   /* Installed PWA on a touch screen: after a tap the element stays in :hover indefinitely, so
      the hover bubble would never go away. Only the timed .tip-live bubble (JS, 1s) shows. */
   @media (display-mode: standalone) and (hover: none){
     [data-tip]:hover::after, [data-tip]:hover::before{content:none;}
   }

   .wheel-sector-hit:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

<body>
<div id="app"></div>

<!-- Cloud sync (optional): loads Firebase's client SDK so goals can sync across devices via a
     private sync code. Harmless no-op if you never fill in firebaseConfig further down. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="quotes.js"></script>

<script>
/* ===== App version (single source of truth) =====
   Scheme: MAJOR.MINOR.PATCH (e.g. v1.0.2).
   - MAJOR (1): основная версия.
   - MINOR (0): глобальные изменения — меняется только по просьбе владельца.
   - PATCH (2): +1 на каждое изменение версии, начиная с 2.
   APP_VERSION is the only place to bump: footer, About panel and tests read it;
   package.json / manifest.json / sw.js are synced to the same value. */
const APP_VERSION = '1.2.21';
/* ===== Wish board constants =====
   Declared high up on purpose: loadState() runs near the top of this script and calls
   ensureWishMap(), which enforces these limits — declaring them lower would blow up in the
   temporal dead zone (ReferenceError on boot / reload with a saved board). */
const WISH_MAX_CARDS = 15;    // hard cap: 15 cards on the board, personal photo included
const WISH_IMG_SIZE = 720;    // card bitmap side (px): crop frame, stored copy, everything is 1:1
const WISH_MAX_SRC_BYTES = 12 * 1024 * 1024; // sane cap for a picked source file
const WISH_TYPES = ['image/png', 'image/jpeg', 'image/webp'];
/* «3 важных дела» line cap. Same dead-zone reason as the wish constants above: loadState() runs
   near the top of this script and calls ensureToday(), which clamps these lines. The row is one
   line tall, so an essay in it breaks the block's rhythm — 80 is the same cap the wish caption
   already uses. Enforced in the markup (maxlength), on every save, and on load/import/cloud. */
const TODAY_TEXT_MAX = 80;
/* Стартовый шаблон блока «Три важных дела на сегодня»: закладывается ОДИН раз — при самом
   первом открытии приложения (см. ensureToday: только пока у блока нет todayDate и все три
   строки ещё нетронуты). Первая задача сразу выполнена — новому пользователю показываем, что
   «Установить приложение» уже сделано. Тексты — данные, живут в state и не переводятся. */
const TODAY_DEFAULT_ITEMS = [
  { text: "Установить приложение - Только важное.", done: true },
  { text: "Прочитать инструкцию, разобраться в функциях.", done: false },
  { text: "Запланировать сферы жизни и цели.", done: false }
];
/* v1.2.11: стандартные звёздочки ☆ ставятся на СУЩЕСТВУЮЩИЕ листья дерева, а не
   отдельными целями в корне: «Учёт всех трат» живёт в Достаток → Расходы,
   «Готовка дома вместо доставки» — в Энергия → Питание. SEED несёт звёздочки
   прямо в себе; старые сохранения размечаются один раз через
   ensurePriorityDefaults (флаг priorityDefaultsSeeded), а хвосты v1.2.8
   (отдельные корни-примеры) вычищаются миграцией (флаг priorityStraysCleaned). */
const PRIORITY_DEFAULT_GOALS = [
  { name: "Учет всех трат", date: "", done: false, children: [], priority: true },
  { name: "Готовка дома вместо доставки", date: "", done: false, children: [], priority: true }
];
const PRIORITY_DEFAULT_NAMES = ["Учет всех трат", "Готовка дома вместо доставки"];
function normPriorityName(s){ return String(s || "").trim().toLowerCase().replace(/ё/g, "е"); }
function isStrayDefaultRoot(c){
  if(!c || typeof c !== "object" || c.archived) return false;
  if(!isLeaf(c) || c.priority !== true || c.checklist) return false;
  const n = normPriorityName(c.name);
  return n === normPriorityName(PRIORITY_DEFAULT_NAMES[0]) || n === normPriorityName(PRIORITY_DEFAULT_NAMES[1]);
}
function starPriorityDefaults(node){
  if(!node || typeof node !== "object") return;
  if(node.archived) return;
  if(isLeaf(node)){
    const n = normPriorityName(node.name);
    if(n === normPriorityName(PRIORITY_DEFAULT_NAMES[0]) || n === normPriorityName(PRIORITY_DEFAULT_NAMES[1])){
      node.priority = true;
    }
    return;
  }
  if(Array.isArray(node.children)) node.children.forEach(starPriorityDefaults);
}
/* ===== Seed data (transcribed from the Excel table) =====
   emptyGoals/emptySteps take the noun to use for auto-generated names, so items added later via
   the UI can be named in whichever language is active at the time (default: Russian for the
   built-in seed data). */
function emptyGoals(word){
  word = word || 'Цель';
  return [1].map(n => ({ name:`${word} ${n}`, date:"", done:false, children:[] }));
}
function emptySteps(subWord, goalWord){
  subWord = subWord || 'Подцель';
  return [1,2].map(n => ({ name:`${subWord} ${n}`, children: emptyGoals(goalWord) }));
}

// Sample data shown on the main page before signing in — 4 goal areas (kept from the original
// design), each broken into 4 subgoals for a fuller, more illustrative example. Most subgoals stay
// a simple two-level list of tasks, but "Здоровье" and "Английский язык" additionally show off
// deeper nesting (goal → subgoal → sub-subgoal → tasks) and two leaves — "Финансовая подушка" and
// "Новые слова" — show off the checklist feature (a leaf tracked as numbered milestones instead of
// a single done/not-done), so a first-time visitor sees the full range of what the tracker can do
// at a glance. Progress per area is deliberately uneven for visual variety on the balance wheel,
// averaging to an overall ~71% — believable rather than "solved".
function leafGoals(names, doneFlags){
  return names.map((name, i) => ({ name, date:"", done: !!doneFlags[i], children:[] }));
}
function checklistLeaf(name, items, doneFlags){
  return { name, date:"", done:false, children:[], checklist: items.map((text, i) => ({ text, done: !!doneFlags[i] })) };
}
const SEED = { name:"Главная", children: [
  { name:"Энергия", children: [
    { name:"Здоровье", children: [
      { name:"Физическое состояние", children: leafGoals(
        ["Полноценный сон 7-8 часов", "Ежегодный чек-ап у врача", "Витамины и минералы"],
        [true, true, true]

    aboutText: 'Только важное помогает двигаться к важному без дедлайнов, давления и лишней сложности.\n\nВыберите цель, разделите её на подцели и маленькие шаги. Делайте главное в своём темпе — каждый завершённый шаг приближает к результату.\n\nЕсли сил или ресурсов стало меньше, цель можно архивировать: она не будет давить и влиять на прогресс. Вернитесь к ней позже, измените или отпустите.\n\nНе нужно успевать всё. Главное — бережно двигаться вперёд.\n\n— Владимир Соколов',
    instructionsTitle: 'Инструкция',
    instructionsText: 'ЦЕЛИ И ПОДЦЕЛИ\nНажмите «+» рядом с «Важные сферы жизни», чтобы создать первую цель. Откройте её и нажмите «+» ещё раз, чтобы разбить на подцели — так можно дробить сколько угодно уровней вглубь, пока задача не станет по-настоящему простой. У цели без подцелей на её странице есть чек-бокс «выполнено».\n\nЧЕК-ЛИСТ\nВместо простого чек-бокса цель можно превратить в список пунктов — кнопка «Добавить чек-лист» на её странице. Процент выполнения тогда считается по отмеченным пунктам, а не по одному общему флажку.\n\nСРОК ВЫПОЛНЕНИЯ\nНа странице цели можно указать дату (день, месяц, год — поля переключаются сами по мере ввода). Дату раньше сегодняшнего дня система не примет.\n\nГЛАВНЫЕ ЦЕЛИ\nЗвёздочка ☆ на странице цели или пункта чек-листа добавляет его в блок «Главные цели» на главном экране — не больше 5 одновременно, чтобы список не превращался в ещё один общий список дел. Так самое важное всегда под рукой, не надо искать его в глубине дерева целей.\n\nАРХИВ\nЗначок архива на странице цели скрывает её (делает бледной) и убирает из расчёта процента выполнения — удобно для целей, которые отложены, но удалять не хочется. Архивная цель автоматически уходит в конец списка.\n\nРЕДАКТИРОВАНИЕ, УДАЛЕНИЕ, ПОРЯДОК, ПЕРЕНОС\nНад списком целей есть кнопки: карандаш — переименовать, «−» — удалить, «↕» — включить режим перемещения (после этого зажмите и перетащите карточку, чтобы изменить порядок). Кнопка-перенос перемещает цель вместе со всем содержимым в другую цель или подцель.\n\nСОРТИРОВКА\nКнопка-фильтр (воронка) рядом с «↕» открывает меню порядка списка: «По убыванию» (сначала самые выполненные цели), «По возрастанию» (наоборот) и «Пользовательский» — ваш собственный порядок перетаскиванием, он включён по умолчанию. Работает и на главном экране, и внутри любой подцели. Архивированные цели всегда остаются в конце списка, пока не станут активными.\n\nРАЗВЕРНУТЬ И РАЗБИТЬ\nКнопка «Развернуть» превращает цель без подцелей в цель с двумя подцелями-чекбоксами, а «Разбить на 6 подшагов» делит её сразу на шесть шагов.\n\nШАБЛОНЫ\nКнопка «Шаблоны» рядом с «+» в «Важных сферах жизни» открывает панель из шести готовых наборов (здоровье, работа, обучение, финансы, отношения, отдых): отметьте нужные цели галочками, посмотрите превью того, что добавится, и подтвердите («Добавить выбранные шаблоны») или закройте («Позже») — без изменений. Если сфера с таким названием уже есть, цели дописываются к ней, повторы пропускаются.\n\nПОИСК\nЛупа в шапке ищет по названиям целей и пунктам чек-листов и показывает путь до совпадения, включая архивные.\n\nКОЛЕСО БАЛАНСА\nВнизу главного экрана — колесо со всеми целями верхнего уровня: сектор заполнен, когда в сфере нет незавершённых целей. Выполнение цели заполняет сектор, частично отмеченный чек-лист даёт дробный вклад (2 из 4 — половина), новая невыполненная цель уменьшает сектор, а удаление выполненной цели показатель не снижает. Нажатие на сектор открывает дерево целей этой сферы — свёрнутый блок «Важные сферы жизни» раскроется сам, а экран подскроллится к раскрывшейся панели.\n\nХорошее сегодня\nПод колесом — необязательный дневник: короткая запись о том, что было хорошего (форма открывается кнопкой «+» и сворачивается той же кнопкой), бейдж прогресса за день и мотивирующая строка. Кнопка «История» открывает все записи: по 7 на страницу, переход по страницам, иконка календаря для прыжка к нужной дате, правка и удаление с подтверждением прямо в истории. Ниже отдельным блоком идут «Победы за неделю» — три вопроса недельной рефлексии («Что было хорошего на этой неделе?», «Чему я научил(ся/ась) на этой неделе?», «Что хочу продолжить на следующей неделе?»): один отчёт на экран, переход «← Предыдущая неделя» / «Следующая неделя →», пропущенную неделю можно заполнить позже.\n\nУ меня будет\nПод дневником — необязательная доска мечт: фото с подписью на карточке, крупный просмотр по тапу, правка подписи и удаление с подтверждением; блок сворачивается по тапу на заголовок, как колесо баланса. Кнопка-сетка в шапке доски выбирает, сколько карточек в ряду — 2, 3 или 4 (по умолчанию 4, в установленном приложении 3), и запоминает выбор, а кнопка-принтер выводит доску на печать одной страницей A4 в той же матрице и в цветах текущей темы. Фото с меткой «Это я» всегда идёт первым, а порядок остальных карточек меняется вручную: в меню доски (кнопка управления карточками) нажмите «↕» у нужной карточки, затем «→» на том месте, куда её поставить. Фото синхронизируются между устройствами через Firebase: байты лежат в Firestore, локальный кэш в IndexedDB работает офлайн; без входа в аккаунт доска остаётся только на этом устройстве. Файл больше 800 КБ в облако не уйдёт — приложение честно скажет об этом и предложит повторить.\n\nНАПОМИНАНИЕ О СФЕРАХ\nЕсли к сфере две недели не возвращались — не открывали её дерево и не меняли цели внутри — над «Важными сферами жизни» появляется мягкое напоминание: «К сфере «Здоровье» давно не возвращались». Это не упрёк и не список дел: сфера просто напоминает о себе, а когда к ней вернуться — решаете вы. «Открыть сферу» ведёт в её дерево целей, «Скрыть» убирает напоминание на те же две недели. Сферы в архиве и сферы, где всё выполнено, не напоминают, а открытие сферы или любое действие с целями внутри неё начинают отсчёт заново.\n\nЛИЧНЫЙ КАБИНЕТ И СИНХРОНИЗАЦИЯ\nБез аккаунта тоже можно пользоваться — все данные хранятся прямо в этом браузере. Если нужно видеть свои цели на нескольких устройствах, создайте аккаунт (значок аккаунта в шапке) — дальше всё синхронизируется само. Если на устройстве уже были несохранённые локальные цели, при входе появится выбор, что оставить — данные без предупреждения никогда не перезаписываются.\n\nРЕЗЕРВНАЯ КОПИЯ\nЕсли вы вошли в аккаунт, в меню (☰) есть «Скачать данные» — сохраняет файл с полной копией целей, и «Импорт данных» — восстанавливает из такого файла. Полезно делать копию время от времени, даже если вы пользуетесь аккаунтом.\n\nУСТАНОВКА И ОБНОВЛЕНИЕ\nНа телефоне сайт можно добавить на главный экран как отдельное приложение — шаги есть в меню («Установить приложение»). Если установленное приложение после обновления сайта выглядит по-старому, откройте меню (☰) и нажмите «Сбросить кэш» — иконку с домашнего экрана удалять не надо, обновление подтянется само.\n\nТЕМЫ И ЯЗЫК\nВ меню можно переключить оформление (тёмная, светлая, розовая тема) и язык интерфейса.',

    aboutText: 'Only What Matters helps you move toward what matters — without deadlines, pressure, or needless complexity.\n\nPick a goal, break it into subgoals and small steps. Do the important things at your own pace — every completed step brings you closer to the result.\n\nIf your energy or resources run low, archive the goal: it will not weigh on you or affect your progress. Come back to it later — change it or let it go.\n\nYou don\'t have to do everything. The point is to move forward, gently.\n\n— Vladimir Sokolov',
    instructionsTitle: 'Instructions',
    instructionsText: 'GOALS AND SUBGOALS\nTap "+" next to "Important Life Areas" to create your first goal. Open it and tap "+" again to break it into subgoals — you can nest as many levels as you like, until a task feels genuinely simple. A goal with no subgoals has a "done" checkbox on its own page.\n\nCHECKLIST\nInstead of a single checkbox, a goal can become a list of items — the "Add checklist" button on its page. Its completion percentage is then based on checked items, not one overall flag.\n\nDUE DATE\nA goal’s page lets you set a date (day, month, year — the fields advance automatically as you type). A date earlier than today won’t be accepted.\n\nMAIN GOALS\nThe ☆ star on a goal’s page or a checklist item adds it to the "Main Goals" block on the home screen — capped at 5 at a time, so it never turns into just another to-do list. That keeps the most important things within reach without digging through the whole tree.\n\nARCHIVE\nThe archive icon on a goal’s page dims it and excludes it from every completion percentage — handy for goals you’re pausing but don’t want to delete. An archived goal automatically moves to the end of its list.\n\nEDITING, DELETING, REORDERING, MOVING\nAbove the goal list: the pencil renames, "−" deletes, and "↕" turns on move mode (press and drag a card to reorder once it’s on). The relocate button moves a goal with all its contents into another goal or subgoal.\n\nSORTING\nThe filter button (funnel) next to "↕" opens a list-order menu: "Descending" (most complete goals first), "Ascending" (the reverse) and "Custom" — your own drag order, on by default. It works both on the home screen and inside any subgoal. Archived goals always stay at the end of the list until they become active again.\n\nEXPAND AND SPLIT\nThe "Expand" button turns a goal with no subgoals into one with two checkbox subgoals, and "Split into 6 steps" breaks it into six steps at once.\n\nTEMPLATES\nThe "Templates" button next to "+" in "Important Life Areas" offers six ready-made sets (health, work, learning, finance, relationships, leisure): tick the goals you want, preview what will be added and confirm ("Add selected templates") — or close ("Later") with no changes. If a sphere with that name already exists, the goals are appended to it and repeats are skipped.\n\nSEARCH\nThe magnifier in the header searches goal titles and checklist items and shows the path to each match, archives included.\n\nBALANCE WHEEL\nAt the bottom of the home screen, the wheel shows every top-level goal at a glance: a sector is full when its area has no open goals. Completing a goal fills its sector, a half-ticked checklist counts fractionally (2 of 4 is half), a new open goal shrinks it, and deleting a completed goal never lowers it. Tap a wheel sector to open that sphere’s tree — the collapsed "Important Life Areas" section expands itself and the screen scrolls to the opened panel.\n\nGOOD TODAY AND WINS OF THE WEEK\nBelow the wheel sits an optional journal: a short note about what went well (the form opens with «+» and closes with the same button), a progress badge for the day and a motivation line. The History button opens every entry — seven per page, page navigation, a calendar icon to jump to a date, and editing/deleting (with confirmation) right there. Below it is Wins of the Week: three weekly reflection questions («What was good this week?», «What did I learn this week?», «What do I want to continue next week?») — one report per screen, «← Previous week» / «Next week →», and a missed week can be filled in later.\n\nI WILL HAVE\nUnder the journal sits the optional dream board: a photo with a caption on a card, a large preview on tap, caption editing and deletion with confirmation; the block collapses by tapping its title, just like the balance wheel. The grid button in the header picks how many cards per row — 2, 3 or 4 (4 by default, 3 in the installed app) — and remembers the choice; the printer button prints the board as a single A4 page in that same matrix, in the colours of the current theme. The photo marked "It’s me" always comes first, and everything else can be reordered by hand: in the board menu (the card-manager button) tap «↕» on a card, then «→» on the slot it should take. Photos sync between devices through Firebase: the bytes live in Firestore, an IndexedDB cache keeps them offline; without an account the board stays on this device only. A file over 800 KB will not reach the cloud — the app says so and offers a retry.\n\nSPHERE REMINDER\nIf you haven’t returned to a sphere for two weeks — you haven’t opened its tree and haven’t touched the goals inside — a gentle note appears above "Important Life Areas": "You haven’t returned to "Health" in a while". It is not a scolding and not a to-do list: the sphere simply says hello, and you decide when to come back. "Open the sphere" takes you to its goal tree; "Hide" puts the note away for the same two weeks. Archived spheres and spheres with everything done never remind, while opening a sphere or any action on its goals starts the countdown over.\n\nACCOUNT AND SYNC\nYou don’t need an account — everything is stored right in this browser. To see your goals on more than one device, create an account (the account button in the header) and it syncs automatically from then on. If a device already had unsaved local goals, signing in shows a choice of what to keep — data is never overwritten without asking first.\n\nBACKUP\nWhen you are signed in, the menu (☰) has "Download data export", which saves a file with a full copy of your goals, and "Import data", which restores from one. Worth doing now and then even if you use an account.\n\nINSTALLING AND UPDATING\nOn a phone, the site can be added to the home screen as its own app — steps are in the menu ("Install app"). If the installed app still looks out of date after a site update, open the menu (☰) and tap "Clear cache" — you keep the home-screen icon, the update arrives by itself.\n\nTHEMES AND LANGUAGE\nThe menu also switches the look (dark, light, pink) and the interface language.',

function loadState(){

         sanitizeEmptyChecklists(parsed);
          ensureWheelTotals(parsed);
          ensureToday(parsed);
          ensurePriorityDefaults(parsed);
          ensureGoodToday(parsed);
          if (parsed.goodToday === undefined) parsed.goodToday = parsed.today.some(item => item.done);
         ensureWishMap(parsed);
         ensureSphereActivity(parsed);
         return parsed;
       }
    }
  }catch(e){}
  const fresh = structuredCloneFallback(SEED);
  sanitizeGoalTree(fresh);
  sanitizeEmptyChecklists(fresh);
   ensureWheelTotals(fresh);
   ensureToday(fresh);
   ensurePriorityDefaults(fresh);
   ensureGoodToday(fresh);
   ensureSphereActivity(fresh);
   return fresh;
}

   you own, just backed by Firebase for storage (that's allowed under 199-ФЗ; the law bans
   third-party identification *buttons*, not using a database). Only you know your password, and
   Firestore rules only let a signed-in user read/write their own document — real per-account
   privacy, not just a secret link.
   To turn this on:
   1) Create a free project at https://console.firebase.google.com
   2) Build -> Firestore Database -> Create database (production mode, any region).
   3) Authentication -> Sign-in method -> enable "Email/Password".

        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /users/{userId} {
              allow read, write: if request.auth != null && request.auth.uid == userId;

            // (needed to check availability before an account even exists). A name can only be

  clearTimeout(cloudSyncTimer);

// The 800 ms debounce must never be the reason a card that is ALREADY in Storage never reaches
// the other devices: closing the tab / backgrounding the PWA inside those 800 ms used to lose
// the Firestore write, and the board then waited for the next reload. Called on pagehide and
// when the document becomes hidden.
function flushCloudPush(){
  if(!cloudSyncTimer) return;         // nothing debounced — nothing to flush
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = null;
  pushCloudStateNow();
}
function pushCloudStateNow(){
  if(!cloudEnabled || !authUser || applyingRemoteUpdate) return;
  // The wish board is written as METADATA ONLY (no image data-URLs): the image bytes live in
  // their own documents, see stateForCloud/wishMapForCloud.
  const ref = firebase.firestore().collection('users').doc(authUser.uid);
  const payload = { state: stateForCloud(state), updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
  cloudPushStatus = 'saving';                    // v1.1.99: honest — a push is in flight, NOT "saved"
  // Optimistic concurrency (v1.1.99, п.7): `{merge:true}` only proves the TOP-level field `state`
  // was replaced, never that two devices' nested edits were BOTH kept — the last writer wins and
  // silently erases the other. So before writing we re-read the document's own timestamp: if the
  // cloud moved AHEAD of the snapshot we last applied (another device wrote after our read), we do
  // NOT overwrite — we raise a conflict the user resolves, instead of destroying their data.
  const attempt = () => {
    ref.get().then((snap)=>{
      const cloudTs = wishTsMs(snap && snap.exists && snap.data ? snap.data().updatedAt : 0);
      if(lastAppliedCloudUpdatedAt && cloudTs > lastAppliedCloudUpdatedAt + CLOUD_TS_TOLERANCE){
        // Someone else advanced the document since we last saw it: a blind set() would drop
        // their change. Keep our working data safe and let the user decide (see resolvePushConflict).
        cloudPushStatus = 'conflict';
        cloudPushRetries = 0;
        render();
        return;
      }
      // merge:true keeps the account's `name`/`consent` fields — this call only touches `state`.
      return ref.set(payload, { merge:true })
        .then(()=>{
          wishCloudPushPending = false;          // only a confirmed write retires the flag
          cloudPushStatus = 'saved';             // v1.1.99: "saved" ONLY after the server confirms
          cloudPushRetries = 0;
          // Our write is now the latest cloud state: remember it (same normalized tree-only form
          // the snapshot listener compares against) so a later snapshot is recognised as a foreign
          // edit — or our own echo — instead of a false conflict with our own push (п.7).
          lastAppliedCloudUpdatedAt = Date.now();
          lastAppliedCloudStateJson = JSON.stringify(stateForCloud(state), syncStripTreeOnly);
          render();
        })
        .catch((err)=>{ cloudPushFailed(err); });
    }).catch((err)=>{ cloudPushFailed(err); });
  };
  attempt();
}
// A push failed (offline, permission-denied, network). Data stays safe locally; we tell the user
// and retry a BOUNDED number of times (never an infinite resend loop). After the cap the user must
// press «Повторить» explicitly — surfacing the failure instead of pretending everything saved.
function cloudPushFailed(err){
  wishCloudPushPending = true;                   // still needs to reach the cloud — retry re-sends
  if(cloudPushRetries < CLOUD_PUSH_MAX_RETRIES){
    cloudPushStatus = 'error';
    cloudPushRetries++;
    clearTimeout(cloudPushRetryTimer);
    // Backoff grows with each failed attempt (2s, 4s, 8s… capped) so a dead network isn't hammered.
    const backoff = Math.min(8000, 2000 * Math.pow(2, cloudPushRetries - 1));
    cloudPushRetryTimer = setTimeout(()=>{ if(authUser && wishCloudPushPending) pushCloudStateNow(); }, backoff);
  }else{
    cloudPushStatus = 'error';                    // give the user an explicit «Повторить»
  }
  render();
}

// account) or take the CLOUD data (our snapshot listener already keeps `state` = cloud). Both
// paths are explicit — neither silently discards the other side.
function resolvePushConflict(useLocal){
  if(useLocal){

    // overwriting the account document on purpose.
    lastAppliedCloudUpdatedAt = 0;
    pushCloudStateNow();
  }else{
    cloudPushStatus = 'idle';
    cloudPushRetries = 0;
    wishCloudPushPending = false;
    render();
  }

  return (k === 'totalGoalsAdded' || k === 'src' || k === 'sphereActivityAt' || k === 'sphereMutedUntil')

async function doAuthSignUp(email, password, name){
  authBusy = true; authError = '';
  const usernameKey = normalizeUsername(name);
  if(!usernameKey){
    authError = t('nameRequired');
    authBusy = false; render();
    return;
  }
  const nameRef = firebase.firestore().collection('usernames').doc(usernameKey);
  try{
    const existing = await nameRef.get();
    if(existing.exists){
      authError = t('nameTaken');
      authBusy = false; render();
      return;
    }
    // Set before createUserWithEmailAndPassword: Firebase fires onAuthStateChanged (which calls
    // startCloudSync) as soon as that resolves, essentially in parallel with the rest of this
    // function, so the flag needs to already be true by then — see the isFreshSignup check in
    // startCloudSync's onSnapshot handler.
    isFreshSignup = true;
    const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
    const user = cred.user;
    try{
      // Reserve the name inside a transaction so two simultaneous sign-ups can't both claim it.
      await firebase.firestore().runTransaction(async (tx)=>{
        const snap = await tx.get(nameRef);
        if(snap.exists) throw new Error('name-taken');
        tx.set(nameRef, { uid: user.uid });
      });
      pendingSignupName = name.trim();
      try{ await user.updateProfile({ displayName: pendingSignupName }); }catch(e){}
      // Send the verification link right after the account is fully set up (name reserved),
      // so we don't waste a send on an account we're about to roll back below.
      try{ await user.sendEmailVerification(); }catch(e){}
    }catch(reserveErr){
      // Someone else grabbed the name in the meantime — undo the just-created account so the
      // email stays free to retry with a different name, instead of leaving an orphaned account.
      isFreshSignup = false;
      try{ await user.delete(); }catch(e){}
      authError = (reserveErr && reserveErr.message === 'name-taken') ? t('nameTaken') : t('authErrGeneric');
      authBusy = false; render();
    }
  }catch(err){
    isFreshSignup = false;
    authError = translateAuthError(err);
    authBusy = false; render();
  }
}

async function doEditAccountSave(name, surname, birthDate, gender, occupation){
  if(!authUser) return;
  const trimmedName = (name || '').trim();
  if(!trimmedName){
    editAccountError = t('nameRequired');
    render();
    return;
  }
  editAccountBusy = true; editAccountError = '';
  render();
  try{
    const newKey = normalizeUsername(trimmedName);
    const oldKey = normalizeUsername(authUser.name || '');
    if(newKey !== oldKey){
      const nameRef = firebase.firestore().collection('usernames').doc(newKey);
      const existing = await nameRef.get();
      if(existing.exists){
        editAccountError = t('nameTaken');
        editAccountBusy = false; render();
        return;
      }
      try{
        // Reserve the new name inside a transaction so two simultaneous renames can't collide.
        await firebase.firestore().runTransaction(async (tx)=>{
          const snap = await tx.get(nameRef);
          if(snap.exists) throw new Error('name-taken');
          tx.set(nameRef, { uid: authUser.uid });
        });
      }catch(reserveErr){
        editAccountError = (reserveErr && reserveErr.message === 'name-taken') ? t('nameTaken') : t('authErrGeneric');
        editAccountBusy = false; render();
        return;
      }
      if(oldKey){
        firebase.firestore().collection('usernames').doc(oldKey).delete().catch(()=>{});
      }
      try{ await firebase.auth().currentUser.updateProfile({ displayName: trimmedName }); }catch(e){}
    }
    await firebase.firestore().collection('users').doc(authUser.uid).set({
      name: trimmedName,
      surname: (surname || '').trim(),
      birthDate: birthDate || '',
      gender: gender || '',
      occupation: (occupation || '').trim(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true });
    authUser.name = trimmedName;
    authUser.surname = (surname || '').trim();
    authUser.birthDate = birthDate || '';
    authUser.gender = gender || '';
    authUser.occupation = (occupation || '').trim();
    editAccountOpen = false;
    editAccountBusy = false;
    render();
  }catch(err){
    editAccountError = translateAuthError(err);
    editAccountBusy = false;
    render();
  }
}

        get.onsuccess = ()=>{ try{ db.close(); }catch(e){} resolve(get.result || null); };
        get.onerror = ()=>{ try{ db.close(); }catch(e){} resolve(null); };

      open.onerror = ()=>resolve(null);

function wishCachePut(id, blob){
  if(!id || !blob) return Promise.resolve(false);
  if(!wishIDBAvailable()){ wishDBFallback.set(id, blob); return Promise.resolve(true); }
  return new Promise((resolve)=>{
    try{
      const open = indexedDB.open(WISH_DB_NAME, 1);
      open.onupgradeneeded = ()=>{
        const db = open.result;
        if(!db.objectStoreNames.contains(WISH_DB_STORE)) db.createObjectStore(WISH_DB_STORE);
      };
      open.onsuccess = ()=>{
        const db = open.result;
        const put = db.transaction(WISH_DB_STORE, 'readwrite').objectStore(WISH_DB_STORE).put(blob, id);
        put.onsuccess = ()=>{ try{ db.close(); }catch(e){} resolve(true); };
        put.onerror = ()=>{ try{ db.close(); }catch(e){} wishDBFallback.set(id, blob); resolve(false); };
      };
      open.onerror = ()=>{ wishDBFallback.set(id, blob); resolve(false); };
    }catch(e){ wishDBFallback.set(id, blob); resolve(false); }
  });
}
function wishCacheDelete(id){

  if(!wishIDBAvailable()) return Promise.resolve(true);
  return new Promise((resolve)=>{
    try{
      const open = indexedDB.open(WISH_DB_NAME, 1);
      open.onsuccess = ()=>{
        const db = open.result;
        const del = db.transaction(WISH_DB_STORE, 'readwrite').objectStore(WISH_DB_STORE).delete(id);
        del.onsuccess = ()=>{ try{ db.close(); }catch(e){} resolve(true); };
        del.onerror = ()=>{ try{ db.close(); }catch(e){} resolve(false); };
      };
      open.onerror = ()=>resolve(false);
    }catch(e){ resolve(false); }
  });
}

function wishCachePutFromDataUrl(id, dataUrl){

function wishRememberBlob(id, blob){

    if(typeof URL === 'undefined' || !URL.createObjectURL) return '';   // no object URLs — pending state

function wishBlobUrlFor(card){

function wishHasLocalBytes(card){
