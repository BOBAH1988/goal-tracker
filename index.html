// Rebuilds the in-memory blob URLs from the local cache (boot, sign-in, cloud merge) so cards
// that only exist in the cloud can still show the pixels we already have. Re-renders once.
async function wishCacheWarm(){
  const cards = Array.isArray(state.wishMap) ? state.wishMap : [];
  // In parallel: each card is its own IndexedDB read, and the board should not wait for card 1
  // before it even asks for card 2 (a full 15-card board warms in one round trip instead of 15).
  const pending = cards
    .filter(c => c && c.id && !wishBlobUrls.has(c.id))
    .map(c => wishCacheGet(c.id).then(blob => (blob ? wishRememberBlob(c.id, blob) : '')));

  const changed = results.some(Boolean);

function dataUrlToBlob(dataUrl){
  // Decode the data: URL ourselves instead of round-tripping through fetch(): it is synchronous
  // for base64 payloads (so an added card is cached in the same tick as the Save tap), has no
  // network-stack dependency, and works everywhere fetch() on a data: URL might be blocked.
  return new Promise((resolve, reject)=>{
    try{
      const comma = String(dataUrl).indexOf(',');
      const header = comma < 0 ? '' : String(dataUrl).slice(0, comma);
      const payload = comma < 0 ? '' : String(dataUrl).slice(comma + 1);
      if(!header.startsWith('data:') || comma < 0) throw new Error('not a data url');
      const mime = (header.slice(5).split(';')[0] || '').trim() || 'application/octet-stream';
      const isBase64 = /;base64/i.test(header);
      if(isBase64){
        const bin = atob(payload);
        const len = bin.length;
        const bytes = new Uint8Array(len);
        for(let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
        resolve(new Blob([bytes], { type: mime }));
        return;
      }
      resolve(new Blob([decodeURIComponent(payload)], { type: mime }));
    }catch(e){
      // Nothing decodable — fall back to the network stack before giving up.
      if(typeof fetch === 'function'){
        fetch(dataUrl).then(r => r.blob()).then(resolve, reject);
      }else{
        reject(e);
      }
    }
  });
}
// Blob → data: URL (base64). The inverse of dataUrlToBlob, used ONLY when writing a backup file:
// the «Карта желаний» bytes live in IndexedDB (never in state), but a JSON backup has nowhere else
// to keep them, so they are embedded as base64 for the restore — this is a snapshot on disk, never
// the live working state, so the "no base64 in state" rule stays intact. Encodes via arrayBuffer +
// a manual base64 step (no FileReader) so it works in every engine and in the test sandbox.
function bytesToBase64(bytes){
  const table = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  let out = '';
  const len = bytes.length;
  for(let i = 0; i < len; i += 3){
    const b0 = bytes[i] & 0xff;
    const b1 = (i + 1 < len) ? (bytes[i + 1] & 0xff) : NaN;
    const b2 = (i + 2 < len) ? (bytes[i + 2] & 0xff) : NaN;
    out += table[b0 >> 2];
    out += table[((b0 & 3) << 4) | (isNaN(b1) ? 0 : (b1 >> 4))];
    out += (isNaN(b1) ? '=' : table[((b1 & 15) << 2) | (isNaN(b2) ? 0 : (b2 >> 6))]);
    out += (isNaN(b2) ? '=' : table[b2 & 63]);
  }
  return out;
}
function blobToDataUrl(blob){
  if(!blob) return Promise.resolve(null);
  const type = blob.type || 'application/octet-stream';
  const finish = (bytes)=> 'data:' + type + ';base64,' + bytesToBase64(bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes));
  if(typeof blob.arrayBuffer === 'function'){
    return blob.arrayBuffer().then(buf => finish(new Uint8Array(buf)), ()=> null);
  }
  // Very old engines without arrayBuffer(): FileReader, if present.
  return new Promise((resolve)=>{
    if(typeof FileReader === 'undefined' || !FileReader){ resolve(null); return; }
    try{
      const fr = new FileReader();
      fr.onload = ()=> resolve(typeof fr.result === 'string' ? fr.result : null);
      fr.onerror = ()=> resolve(null);
      fr.readAsDataURL(blob);
    }catch(e){ resolve(null); }
  });
}

// crop dialog produces; on an engine without canvas WebP encoding the fallback is JPEG, and the
// image document records the real type so the other device rebuilds the same Blob.
function wishImageType(blob){
  const type = String(blob && blob.type || '').toLowerCase();
  if(type === 'image/jpeg' || type === 'image/jpg') return 'image/jpeg';
  if(type === 'image/png') return 'image/png';
  return 'image/webp';

// Uploads a card's cached bytes into its Firestore image document. ONLY after the write resolves
// does the card become an uploaded one (imagePath set, uploadState='uploaded', metadata pushed to
// Firestore) — a failed write leaves uploadState='error' and the pixels stay cached for a retry.
async function uploadWishCard(card){
  if(!wishCloudReady() || !card || !card.id) return;
  const blob = await wishCacheGet(card.id);
  if(!blob) return;                       // nothing cached — keep pending, retry later
  if(blob.size > WISH_MAX_UPLOAD_BYTES){ markWishUploadError(card); return; }
  try{
    // Raw bytes, not base64: Firestore stores them natively, which keeps a card at its real size
    // instead of +33% for the encoding, and the document stays far below the 1 MiB limit.
    // Firestore accepts bytes ONLY as its own Blob type — a raw Uint8Array is rejected with
    // invalid-argument ("Unsupported field value: a custom Uint8Array object (found in field
    // bytes)"), which is exactly what the «Фото не попало в облако (invalid-argument)» note was.
    const bytes = new Uint8Array(await blob.arrayBuffer());
    await wishImageDoc(card).set({
      uid: authUser.uid,
      type: wishImageType(blob),
      size: blob.size,
      bytes: firebase.firestore.Blob.fromUint8Array(bytes),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){
    // Offline / Firestore rules not deployed (permission-denied) / network. The pixels survive in
    // the local cache and the card keeps a «Повторить» button; the reason is shown on the board so
    // it is diagnosable instead of a silent "photo only on this device".
    markWishUploadError(card, e);
    return;
  }

  if(!live) return;                       // deleted while uploading
  live.imagePath = wishImagePath(card);
  live.uploadState = 'uploaded';
  live.updatedAt = Date.now();
  wishLastUploadError = null;             // this card reached the cloud — clear its error note
  wishCloudPushPending = true;            // metadata changed: Firestore must hear about it
  saveState();                            // metadata only, small
  scheduleCloudPush();                    // → the account document, after the file is safely up
  render();
}
function markWishUploadError(card, err){
  if(!card || !card.id) return;
  card.uploadState = 'error';

  // The two realistic causes are no network and Firestore rules that were never deployed.
  wishLastUploadError = {
    id: card.id,
    code: String((err && (err.code || err.message)) || '')

  saveState();
  render();
}
// Pulls the bytes for a card that has metadata but nothing cached (another device / fresh
// install). Reads its image document, caches the pixels locally, then renders from the blob URL.
async function downloadWishImage(card){
  if(!wishCloudReady() || !card || !card.imagePath) return;
  try{
    const snap = await wishImageDoc(card).get();
    if(!snap.exists) throw new Error('image-missing');
    const data = snap.data() || {};
    // Firestore hands bytes back as its OWN Blob (toUint8Array()). A plain typed array is
    // accepted too, so a document written by any shape still restores on every device.
    let raw = data.bytes;
    if(raw && typeof raw.toUint8Array === 'function') raw = raw.toUint8Array();
    if(!raw || !raw.length) throw new Error('image-empty');
    const blob = new Blob([raw], { type: data.type || 'image/webp' });
    await wishCachePut(card.id, blob);
    wishRememberBlob(card.id, blob);
    const live = (state.wishMap || []).find(c => c.id === card.id);
    if(live){
      live.uploadState = 'uploaded';
      wishCloudPushPending = true;
      saveState();
      render();
    }
  }catch(e){
    // permission-denied (firestore.rules not deployed), document missing, offline, not signed in —
    // the card keeps its pending placeholder; the next sign-in / snapshot / save retries via
    // syncWishBoard.
  }
}
// One pass over the board: upload cards whose bytes exist only here, download cards whose bytes
// exist only in the cloud. Safe to call often — every card is in its final state or one async
// step away from it.
function syncWishBoard(){
  if(!wishCloudReady()) return;
  (state.wishMap || []).forEach(c => {
    if(!c || !c.id) return;
    if(c.uploadState === 'pending' || c.uploadState === 'error'){
      if(wishHasLocalBytes(c)) uploadWishCard(c);   // retry / first upload from the cache
      else if(c.imagePath) downloadWishImage(c);     // bytes only exist in the cloud

    }
  });

function wishBoardReady(){

// Another pass over the board, but ONLY when there is something outstanding: a card whose
// upload or download is still pending/errored, or whose bytes we do not have locally yet.
// Runs when the app returns to the foreground or the network comes back, plus a light timer —
// one failed attempt used to leave the board stuck until a full reload, which is what made
// «картинки есть только на том устройстве» look permanent.
function wishSyncRetry(){
  if(!wishCloudReady()) return;
  const cards = state.wishMap || [];
  const outstanding = cards.some(c => !!c && !!c.id && (
    c.uploadState === 'pending' || c.uploadState === 'error' || (c.imagePath && !wishHasLocalBytes(c))

  if(!outstanding && !wishCloudPushPending) return;

// Removes the image document of a deleted card (never blocks the UI; the Firestore record goes

    'width:190mm; height:277mm; margin:0; padding:0;' +
    'background:' + bodyBg + '; color:' + textC + ';';
  const title = document.createElement('div');
  title.style.cssText = 'flex:none; text-align:center; margin:4mm 0 6mm;';
  // Явные font-size/font-weight вместо шортката font:700 36mm — шорткат некоторые движки печати
  // отбрасывают целиком, и размер/насыщенность не применяются (баг «заголовок не меняется»).
  title.innerHTML = '<div style="font-family:' + fontTitle + '; font-size:36mm; font-weight:700;'
    + ' line-height:1.05; letter-spacing:0.4mm; color:' + textC + ';">'
    + esc(t('mainGoals')) + '</div>';
  root.appendChild(title);
  // Список сфер — РОВНАЯ сетка: имя (режется по длине) | процент | шкала. Треки фиксированной
  // ширины, поэтому все шкалы одной длины и выровнены по правому краю независимо от названия.
  // max-height + overflow не дают длинному списку вытолкнуть колесо за нижний край листа A4.
  const list = document.createElement('div');
  list.style.cssText = 'flex:none; max-height:78mm; overflow:hidden; display:flex; flex-direction:column; gap:3mm; margin:2mm 6mm 6mm;';
  items.forEach(sphere => {
    const pct = computePercent(sphere);
    const row = document.createElement('div');
    row.style.cssText = 'display:grid; grid-template-columns:1fr 14mm 66mm; align-items:center; gap:4mm;';
    const name = document.createElement('span');
    name.textContent = sphere.name || '';
    name.style.cssText = 'font:500 5mm/1.2 ' + fontUi + '; color:' + textC + '; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;';
    const pctEl = document.createElement('span');
    pctEl.textContent = pct + '%';
    pctEl.style.cssText = 'font:600 4.5mm/1.2 ' + fontUi + '; text-align:right; color:' + textC + '; font-variant-numeric:tabular-nums;';
    const bar = document.createElement('span');
    bar.style.cssText = 'display:block; height:3.6mm; border-radius:1.8mm; overflow:hidden; border:0.3mm solid ' + borderC + ';';
    const fill = document.createElement('span');
    fill.style.cssText = 'display:block; height:100%; width:' + pct + '%; background:' + barColor(pct) + ';';
    bar.appendChild(fill);
    row.appendChild(name); row.appendChild(pctEl); row.appendChild(bar);
    list.appendChild(row);
  });
  root.appendChild(list);
  // Колесо — остаток страницы. Подписи секторов центрируем сразу (centerLabels), т.к. экранный
  // adjustWheelLabels() для этого узла не работает. Вместо ненадёжного transform:scale (его печать
  // в PDF игнорирует/обрезает) реально увеличиваем колесо кропом viewBox: родной "0 0 572 320"
  // даёт ~300px мёртвого поля по бокам, поэтому обрезаем вид до содержимого (примерно 230×320) —
  // колесо заполняет лист по-настоящему. SVG тянется на всю ширину, высота — по пропорции.
  const wheelBox = document.createElement('div');
  wheelBox.style.cssText = 'flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center;';
  wheelBox.innerHTML = wheelHTML(items, {
    labelColor: textC, ringColor: '#9aa0a6', centerLabels: true,
    viewBox: '60 0 452 320'  // кроп мёртвых полей (по 60px с краёв) → колесо крупнее ~+26%
  });
  const svg = wheelBox.querySelector('svg');
  // Колесо ВПИСЫВАЕТСЯ в доступную область страницы (width/height 100% + preserveAspectRatio),
  // поэтому никогда не вылезает за нижний край A4 — даже с длинным списком сфер и крупным
  // заголовком. Раньше height:auto фиксировал высоту от ширины, и колесо уезжало со страницы.
  if(svg){
    svg.style.maxWidth = 'none';
    svg.style.width = '100%';
    svg.style.height = '100%';
    svg.style.maxHeight = '100%';
  }
  root.appendChild(wheelBox);
  document.body.appendChild(root);
  document.body.classList.add('wheel-printing');
  // Имя файла при печати в PDF берётся из document.title. Временно подменяем его на название
  // печати и возвращаем исходный в cleanup (после печати / по таймауту).
  const savedTitle = document.title;
  document.title = t('wheelPrintTitle');
  let done = false;
  const cleanup = () => {
    if(done) return;
    done = true;
    clearTimeout(fallback);
    document.body.classList.remove('wheel-printing');
    if(root && root.parentNode) root.parentNode.removeChild(root);
    if(document.title === t('wheelPrintTitle')) document.title = savedTitle;
    window.removeEventListener('afterprint', cleanup);
    window.removeEventListener('focus', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  window.addEventListener('focus', cleanup);
  const fallback = setTimeout(cleanup, 2500);
  try{ window.print(); }catch(e){ cleanup(); }
}

// Возвращает true, когда картинка ушла в navigator.share. False — если
// движок не умеет 2d-canvas / share (или пользователь отменил): вызывающая
// сторона тогда показывает подсказку. Любая ошибка рисования ловится —
// молчание недопустимо, владелец уже видел «ничего не происходит».
async function shareWishBoardPng(cards, cols){
  try{
    return await drawWishBoardPng(cards, cols);
  }catch(e){
    return false;
  }
}
async function drawWishBoardPng(cards, cols){
  const canvas = document.createElement('canvas');
  if(!canvas || !canvas.getContext) return false;
  const g = canvas.getContext('2d');
  if(!g) return false;   // без 2d-canvas (jsdom, старые движки) рисовать нечем
  const W = 1240, H = 1754;   // A4 portrait, ~150 dpi
  canvas.width = W; canvas.height = H;
  const rootVars = (typeof getComputedStyle === 'function') ? getComputedStyle(document.documentElement) : null;
  const cssVar = (name, fallback) => (rootVars ? (rootVars.getPropertyValue(name) || '').trim() : '') || fallback;
  const textC = cssVar('--text', '#111111');
  const cardBg = cssVar('--card', '#ffffff');
  const borderC = cssVar('--border', '#c9c9c9');
  const mutedC = cssVar('--muted', '#6b6b6b');
  const fontUi = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const fontTitle = 'Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif';
  // Фон — тот же градиент body: стопы берём из вычисленного background-image;
  // не распарсились — сплошной --bg.
  const bodyVars = (typeof getComputedStyle === 'function') ? getComputedStyle(document.body) : null;
  const bgImage = bodyVars ? (bodyVars.backgroundImage || '') : '';
  const stops = [...bgImage.matchAll(/rgba?\(([^)]*)\)/g)].map(m => 'rgb(' + m[1] + ')');
  if(stops.length >= 2){
    const grad = g.createLinearGradient(0, 0, 0, H);
    stops.forEach((c, i)=>{ grad.addColorStop(i / (stops.length - 1), c); });
    g.fillStyle = grad;
  }else{
    g.fillStyle = cssVar('--bg', '#ffffff');
  }
  g.fillRect(0, 0, W, H);
  // Заголовок — как на DOM-странице: крупный серифный, по центру.
  const margin = 60;   // ~10 mm
  const gap = 60;      // ~4 mm
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = textC;
  g.font = '600 64px ' + fontTitle;
  g.fillText(t('wishMapTitle'), W / 2, margin + 40);
  const areaX = margin, areaW = W - margin * 2;
  const areaY = margin + 100 + gap;
  const areaH = H - margin - areaY;
  const rows = Math.max(1, Math.ceil(cards.length / cols));
  const cellW = (areaW - gap * (cols - 1)) / cols;
  const cellH = (areaH - gap * (rows - 1)) / rows;
  const capH = 56;   // место на подпись внутри ячейки
  for(let i = 0; i < cards.length; i++){
    const c = cards[i];
    const r = Math.floor(i / cols), col = i % cols;
    const x = areaX + col * (cellW + gap);
    const y = areaY + r * (cellH + gap);
    roundRectPath(g, x, y, cellW, cellH, 24);
    g.fillStyle = cardBg;
    g.fill();
    g.lineWidth = 4;
    g.strokeStyle = borderC;
    g.stroke();
    // Картинка с обрезкой cover — или честная пометка, как на экране.
    const imgX = x + 8, imgY = y + 8;
    const imgW = cellW - 16, imgH = cellH - 16 - capH;
    const url = wishBlobUrlFor(c);
    const img = url ? await loadWishImage(url) : null;
    g.save();
    roundRectPath(g, imgX, imgY, imgW, imgH, 16);
    g.clip();
    if(img){
      const scale = Math.max(imgW / img.width, imgH / img.height);
      const dw = img.width * scale, dh = img.height * scale;
      g.drawImage(img, imgX + (imgW - dw) / 2, imgY + (imgH - dh) / 2, dw, dh);
    }else{
      g.fillStyle = cardBg;
      g.fillRect(imgX, imgY, imgW, imgH);
      g.fillStyle = mutedC;
      g.font = '400 30px ' + fontUi;
      wrapText(g, t('wishUploadMissing'), imgX + imgW / 2, imgY + imgH / 2, imgW - 24, 40);
    }
    g.restore();
    // Подпись — по центру, до двух строк.
    if(c.title){
      g.fillStyle = textC;
      g.font = '500 34px ' + fontUi;
      wrapText(g, c.title, x + cellW / 2, y + cellH - capH / 2, cellW - 24, 42, 2);
    }
  }
  const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
  if(!blob || typeof File !== 'function') return false;
  const file = new File([blob], 'wish-board.png', {type: 'image/png'});
  // canShare на части iOS отсутствует, хотя share({files}) работает —
  // не гейтим на нём, а пробуем и ловим отказ (отмена пользователя — тоже false).
  if(typeof navigator.share !== 'function') return false;
  await navigator.share({files: [file], title: t('wishMapTitle')});
  return true;
}
// Скруглённый прямоугольный путь (ctx.roundRect есть не везде — рисуем руками).
function roundRectPath(g, x, y, w, h, r){
  g.beginPath();
  if(g.roundRect){ g.roundRect(x, y, w, h, r); return; }
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
// Переносит текст по словам в заданную ширину, центрируя по cx; maxLines
// обрезает лишние строки (подписи карточек — до двух).
function wrapText(g, text, cx, cy, maxW, lineH, maxLines){
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  for(const w of words){
    const test = line ? line + ' ' + w : w;
    if(g.measureText(test).width > maxW && line){ lines.push(line); line = w; }
    else line = test;
  }
  if(line) lines.push(line);
  const shown = maxLines ? lines.slice(0, maxLines) : lines;
  const y0 = cy - (shown.length - 1) * lineH / 2;
  shown.forEach((l, i)=>{ g.fillText(l, cx, y0 + i * lineH); });
}
// Загрузка локальных байтов карточки в <img> для drawImage. Blob-URL
// same-origin, canvas не «пачкается». Неудача — null, рисуется пометка.
function loadWishImage(url){
  return new Promise(res=>{
    try{
      const img = new Image();
      img.onload = ()=>res(img);
      img.onerror = ()=>res(null);
      img.src = url;
    }catch(e){ res(null); }
  });
}
// Тот же приём, что у undo-toast: элемент в document.body (render() его

function showPrintHint(key){

/* ===== «Поделиться» (меню ☰) =====
   Системное окно Web Share API — там, где оно есть (iOS/Android, Safari и Chrome на десктопе).
   Там, где navigator.share нет (старый браузер или не-https страница), — ссылка уходит в буфер
   обмена, а пользователь видит ненавязчивое уведомление: без alert, без модалок, без звука.
   Отмена пользователем (AbortError) — не ошибка, в консоли тишина. */
const SHARE_URL = 'https://bobah1988.github.io/goal-tracker/';
const SHARE_TITLE = 'Только важное — твой путь к счастливой жизни';
const SHARE_TEXT = 'Попробуй приложение “Только важное”: спокойный трекер целей без давления и сроков.';
let shareHintEl = null;
let shareHintTimer = null;
function showShareHint(text){
  // Предыдущее уведомление убираем, чтобы быстрые тапы не складывали стопку тостов.
  if(shareHintEl && shareHintEl.parentNode) shareHintEl.parentNode.removeChild(shareHintEl);
  clearTimeout(shareHintTimer);
  const toast = document.createElement('div');
  toast.className = 'undo-toast';
  const label = document.createElement('span');
  label.textContent = text;
  toast.appendChild(label);
  document.body.appendChild(toast);
  shareHintEl = toast;
  shareHintTimer = setTimeout(()=>{
    if(shareHintEl && shareHintEl.parentNode) shareHintEl.parentNode.removeChild(shareHintEl);
    shareHintEl = null;
  }, 5000);
}
async function copyShareLink(){
  // Современный путь: Clipboard API (страница всегда на https — GitHub Pages).
  if(navigator.clipboard && navigator.clipboard.writeText){
    await navigator.clipboard.writeText(SHARE_URL);
    return;
  }
  // Запасной путь: временное textarea + execCommand для старых браузеров.
  const ta = document.createElement('textarea');
  ta.value = SHARE_URL;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '0';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{
    if(!document.execCommand('copy')) throw new Error('execCommand refused');
  }finally{
    if(ta.parentNode) ta.parentNode.removeChild(ta);
  }
}
async function shareApp(){
  if(navigator.share){
    try{
      // Вызывается синхронно в жесте клика — iOS требует transient activation для share().
      await navigator.share({ title: SHARE_TITLE, text: SHARE_TEXT, url: SHARE_URL });
    }catch(err){
      // Только отмена пользователем (AbortError) — его выбор, тишина.
      // Любая другая ошибка Web Share API — тот же путь, что и при отсутствии
      // navigator.share: ссылка в буфер, а если буфер недоступен — ссылка
      // текстом для ручного копирования.
      if(err && err.name === 'AbortError') return;
      try{
        await copyShareLink();
        showShareHint(t('shareCopied'));
      }catch(e2){
        showShareHint(`${t('shareCopyFailed')} ${SHARE_URL}`);
      }
    }
    return;
  }
  try{
    await copyShareLink();
    showShareHint(t('shareCopied'));
  }catch(err){
    // Буфер недоступен совсем — показываем ссылку текстом, чтобы её можно было скопировать руками.
    showShareHint(`${t('shareCopyFailed')} ${SHARE_URL}`);
  }
}

// Removes a card everywhere it exists: local cache + cloud image document. Firestore follows because the
// card is gone from state, and scheduleCloudPush writes the projection.
async function deleteWishCard(card){
  if(!card || !card.id) return;
  const url = wishBlobUrls.get(card.id);
  if(url){ try{ URL.revokeObjectURL(url); }catch(e){} wishBlobUrls.delete(card.id); }
  await wishCacheDelete(card.id);
  deleteWishImageFile(card);
}

// percent = 100% * (1 - fractionalIncomplete / max(totalGoalsAdded, activeLeaves)),
// clamped to 0..100. Incomplete is fractional: an open plain leaf contributes 1,
// a 2/4 checklist contributes 0.5 of open load. The sticky "ever added" total is
// preserved (deleting a done goal keeps its sector filled), while max() guards
// against a stale total smaller than the live leaf count (e.g. a leaf turning
// into a checklist, or an add path that missed its bump): such a total would
// otherwise push a healthy sphere down toward 0%. total = 0 (nothing ever
// added) → 100%.
function wheelPercent(item){
  if(!item || item.archived) return 100;
  // A lone leaf sector shows its own fill: plain checkbox 100/0, checklist by
  // ticked items — the same number its card progress shows.
  if(isLeaf(item)) return computePercent(item);
  ensureWheelTotals(item);
  const active = countWheelLeaves(item, false);
  const total = Math.max(wheelTotal(item), active);
  if(total <= 0) return 100;
  const incomplete = Math.max(0, active - countWheelDone(item));
  const pct = Math.round(100 * (1 - incomplete / total));
  return Math.max(0, Math.min(100, pct));
}
// Bumps the sticky counter on every container along `containerPath` (root `state` at [],
// deeper containers at their paths). `delta` is +n for newly added leaf goals, -n when those
// leaves physically move to another sphere (relocate). Totals never go below 0.
function bumpWheelTotals(containerPath, delta){
  let node = state;
  if(node && !isLeaf(node)) setWheelTotal(node, wheelTotal(node) + delta);
  for(const i of containerPath){
    if(!node || !node.children || !node.children[i]) return;
    node = node.children[i];
    if(node && !isLeaf(node)) setWheelTotal(node, wheelTotal(node) + delta);
  }
}
function activeChildren(node){
  return (node.children || []).filter(c => !c.archived);
}
function computePercent(node){
  if(isLeaf(node)){
    // A leaf with a checklist fills up according to how many of its checklist lines are ticked
    // off, instead of the plain done/not-done toggle.
    if(node.checklist && node.checklist.length){
      const doneN = node.checklist.filter(i => i.done).length;
      return Math.round((doneN / node.checklist.length) * 100);
    }
    return node.done ? 100 : 0;
  }
  if(node.children && node.children.length){
    const active = activeChildren(node);
    if(!active.length) return 0;
    const vals = active.map(computePercent);
    return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  }
  return 0;
}
function doneCount(node){
  if(!node.children) return 0;
  return activeChildren(node).filter(c => computePercent(c) === 100).length;
}
// A real, lossless backup of the whole goal tree + the «Карта желаний» photos, meant to be
// restored later via "Импорт данных" — as opposed to the 📤 share-progress image, which is a lossy
// visual summary for showing someone else your progress, not something meant to be read back in.
// The photos are collected SEPARATELY from state: their bytes never enter the live working state or
// localStorage (they live in the IndexedDB cache), but a backup has to carry them or a restore on a
// fresh browser would bring back metadata-only cards with no pictures. So we read each cached blob,
// embed it as base64 in the JSON, and list any card whose bytes we could NOT find (still uploading,
// or lost) so the user can be told instead of silently shipping an incomplete board.
async function doExportData(){
  const payload = {
    app: 'goal-tracker-backup',
    version: 2,                       // v2 carries wishMap photos (v1 = metadata only)
    exportedAt: new Date().toISOString(),
    state
  };
  const cards = (state && Array.isArray(state.wishMap)) ? state.wishMap : [];
  const images = {};
  const missingImages = [];
  for(const card of cards){
    if(!card || !card.id) continue;
    try{
      const blob = await wishCacheGet(card.id);
      const dataUrl = blob ? await blobToDataUrl(blob) : null;
      if(dataUrl) images[card.id] = dataUrl;
      else missingImages.push(card.id);
    }catch(e){
      missingImages.push(card.id);
    }
  }
  // Only attach the images block when there are photos to carry (keeps old-style boards tiny).
  if(Object.keys(images).length) payload.wishImages = images;
  if(missingImages.length) payload.missingImages = missingImages;
  // If some photos could not be collected, tell the user and let them choose: re-download first, or
  // ship the copy as-is (goals are always complete — only those photos are absent). Never silently.
  if(missingImages.length && typeof confirm === 'function'){
    const msg = t('exportMissingImages').replace('{n}', String(missingImages.length));
    if(!confirm(msg)) return;   // user chose to go download the missing photos first
  }
  const text = JSON.stringify(payload, null, 2);
  const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `goal-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
// A valid goal tree is, at minimum, an object with a string `name` and an array `children` —
// matches both the root state and every container/leaf node inside it.
function isValidGoalTree(obj){
  return !!obj && typeof obj === 'object' && typeof obj.name === 'string' && Array.isArray(obj.children);
}
function doImportData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    let parsed;
    try{
      parsed = JSON.parse(reader.result);
    }catch(e){
      alert(t('importErrorParse'));
      return;
    }
    // Accept both our own backup wrapper ({app, version, state}) and a bare state object, so a
    // manually-trimmed JSON file still imports.
    const candidate = (parsed && parsed.state && typeof parsed.state === 'object') ? parsed.state : parsed;
    if(!isValidGoalTree(candidate)){
      alert(t('importErrorInvalid'));
      return;
    }
    if(!confirm(t('importConfirm'))) return;
    state = candidate;
    // Imported trees (old backups, hand-made files) may lack the wheel counter entirely —
    // backfill total = current active leaves (past deletions unknowable, acceptable per spec).
     sanitizeGoalTree(state);
     sanitizeEmptyChecklists(state);
     ensureWheelTotals(state);
     ensureToday(state);
     ensurePriorityDefaults(state);
     ensureGoodToday(state);
     ensureWishMap(state);
     ensureSphereActivity(state);
    path = [];
    // Restore «Карта желаний» photos (v2 backups carry them as base64). They go straight into the
    // IndexedDB cache — never into state — so the board renders them from blob URLs like any local
    // card. Old v1 backups (no wishImages) simply keep metadata-only cards, exactly as before.
    let restored = 0, missing = 0;
    const imgs = (parsed && parsed.wishImages && typeof parsed.wishImages === 'object') ? parsed.wishImages : null;
    if(imgs){
      for(const card of (Array.isArray(state.wishMap) ? state.wishMap : [])){
        if(!card || !card.id || !imgs[card.id]) continue;
        try{
          const blob = await dataUrlToBlob(imgs[card.id]);
          if(blob){ await wishCachePut(card.id, blob); wishRememberBlob(card.id, blob); restored++; }
          else missing++;
        }catch(e){ missing++; }
      }
    }
    saveState();
    if(cloudEnabled && authUser) scheduleCloudPush();
    // Honest result: goals are always complete; say exactly which photos came back and which didn't.
    let msg = t('importSuccessMsg');
    if(restored || missing){
      msg += ' ' + t('importImagesRestored').replace('{ok}', String(restored)).replace('{missing}', String(missing));
    }
    alert(msg);
    render();
    if(typeof wishCacheWarm === 'function') wishCacheWarm();
  };
  reader.readAsText(file);
}
/* Progress colour bands (owner spec, v1.1.54): 75%+ green, 50%+ yellow, 25%+ orange, below a
   soft light red. All four are theme variables, so the bands stay muted in every theme — no
   bright, out-of-palette shades. Shared by every bar and percentage in the app. */
function barColor(pct){
  if(pct>=75) return "var(--green)";
  if(pct>=50) return "var(--yellow)";
  if(pct>=25) return "var(--orange)";
  return "var(--red-soft)";
}
function esc(s){
  return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Resolves the destination container path for a relocate against the PRE-MOVE tree, then shifts
// it for the source removal that is about to happen (only children of the source's parent after
// sourceIdx move one slot left; the walk itself runs before the splice, so no post-splice index
// games). Returns null when the picker path no longer resolves to destNode. Pure tree math —
// exported to tests.
function relocateDestPath(pickerPath, destNode, sourceParentPath, sourceIdx){
  let n = state;
  const destPath = [];
  for(const i of pickerPath){
    if(!n.children || !n.children[i]) return null;
    destPath.push(i);
    n = n.children[i];
  }
  if(n !== destNode) return null;
  if(destPath.length > sourceParentPath.length){
    let sameParent = true;
    for(let d = 0; d < sourceParentPath.length; d++){
      if(destPath[d] !== sourceParentPath[d]){ sameParent = false; break; }
    }
    if(sameParent && destPath[sourceParentPath.length] > sourceIdx){
      destPath[sourceParentPath.length] -= 1;
    }
  }
  return destPath;
}
// Destination-picker modal shown while relocateSourcePath is set (see relocateMode). Lets the
// user drill down into any container and drop the source node there as a new child — the source
// itself, and anything already inside it, is filtered out of every list here so it's never
// possible to move a node into its own subtree.
function relocatePickerHTML(){
  const sourceNode = resolve(relocateSourcePath);
  if(!sourceNode) return '';
  let pickerNode = state;
  let valid = true;
  for(const i of relocatePickerPath){
    if(!pickerNode.children || !pickerNode.children[i]){ valid = false; break; }
    pickerNode = pickerNode.children[i];
  }
  if(!valid){ relocatePickerPath = []; pickerNode = state; }
  const children = pickerNode.children || [];
  const eligible = children
    .map((c, i) => ({ c, i }))
    .filter(({ c }) => c !== sourceNode && !isLeaf(c));
  const destName = relocatePickerPath.length === 0 ? t('home') : esc(pickerNode.name);

  let crumbNode = state;
  let crumbs = [`<span class="relocate-crumb" data-relocate-crumb="0">${t('home')}</span>`];
  relocatePickerPath.forEach((i, idx) => {
    crumbNode = crumbNode.children[i];
    crumbs.push(`<span class="sep">›</span><span class="relocate-crumb" data-relocate-crumb="${idx+1}">${esc(crumbNode.name)}</span>`);
  });

  return `<div class="auth-modal-overlay" id="relocateOverlay">
    <div class="auth-panel scrollable wide">
      <button class="auth-close" id="btnRelocateClose" aria-label="close" title="${t('done')}">✕</button>
      <h2 style="margin:0 0 4px; font-size:16px;">${t('relocateTitle')}</h2>
      <div class="relocate-source-name">${t('relocateMoving')} «${esc(sourceNode.name)}»</div>
      <div class="relocate-breadcrumb">${crumbs.join('')}</div>
      <div class="relocate-list">
        ${eligible.length
          ? eligible.map(({ c, i }) => `<button type="button" class="relocate-row" data-relocate-nav="${i}">${esc(c.name)} ›</button>`).join('')
          : `<div class="empty-state">${t('relocateEmptyState')}</div>`}
      </div>
      <button type="button" id="btnRelocateHere" class="relocate-here-btn">${t('relocateHereBtn')(destName)}</button>
    </div>
  </div>`;
}

/* ===== Render ===== */
function render(){
  // If a card/checklist-row drag is still in progress when render() gets triggered by something
  // else entirely (e.g. a Firestore cloud-sync snapshot landing mid-gesture — more likely for
  // goals with subgoals, since their bigger state tree takes a little longer to round-trip,
  // giving the sync echo more of a chance to land while the user is still holding the card), the
  // element currently being dragged (positioned via an inline position:fixed, outside the normal
  // grid flow) is about to be discarded by the innerHTML rebuild below. Clean up its drag state
  // first, otherwise pointer capture keeps routing move/up events to that now-detached node —
  // which has no visual effect — and the card that reappears in the freshly rendered grid never
  // gets un-stuck from its last fixed position, looking like it's frozen floating above everything.
  if(dragCtx) cancelDrag();
  validatePath();
  // Belt-and-suspenders: the "today" block must always have a real array behind it. Every state
  // entry point already runs ensureToday(), but a single guarantee here makes the block immune to
  // any future path that swaps `state` without it (the exact bug that broke the checklist on the
  // deployed site: homeViewHTML rendered fallback rows while the handlers bailed on a non-array).
   ensureToday(state);
   // Same guarantee for the wish map: every state-swap path (import, cloud snapshot) runs
   // through render(), so a board-less state can never break homeViewHTML.
   ensureWishMap(state);
   // And for the «Хорошее сегодня» journal — a journal-less state must never break the render.
   ensureGoodToday(state);
   const app = document.getElementById('app');
  const node = resolve(path);
  const overallPct = computePercent(state);

  document.documentElement.lang = lang;
  document.documentElement.setAttribute('data-theme', theme);
  document.title = t('appTitle');
  // The status/navigation bar colour must follow the active theme. A hard-coded dark
  // theme-color left Android's system bars black in the light and pink themes, which read as a
  // mismatch between the app chrome and the page ("оформление плывёт") — especially on an
  // installed PWA where the system bars are always visible. Purely cosmetic: never let a
  // missing/odd implementation break the render.
  try{
    const themeColorMeta = document.querySelector('meta[name="theme-color"]');
    const cssBg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    if(themeColorMeta && cssBg) themeColorMeta.setAttribute('content', cssBg);
  }catch(e){}

  let html = topbarHTML();

  html += systemPanelsHTML();

  html += statusPanelsHTML();

  html += authPanelsHTML();
  html += templatesModalHTML();

  html += renderBreadcrumb();

  const addSubActive = addSubMode && path.length === 2;
  const mode = editMode ? 'edit' : deleteMode ? 'delete' : addSubActive ? 'addsub' : moveMode ? 'move' : relocateMode ? 'relocate' : null;
  const protectedCount = protectedCountFor(path.length);
  const hintHTML = editMode
    ? ` <span class="edit-hint">${t('editHint')}</span>`
    : deleteMode
      ? ` <span class="edit-hint delete-hint">${t('deleteHint')(protectedCount)}</span>`
      : addSubActive
        ? ` <span class="edit-hint">${t('addSubHint')}</span>`
        : moveMode
          ? ` <span class="edit-hint">${t('moveHint')}</span>`
          : relocateMode
            ? ` <span class="edit-hint">${t('relocateHint')}</span>`
            : '';

  if(path.length===0){
    html += homeViewHTML(overallPct, hintHTML, mode, protectedCount);
  } else {
    html += nodeViewHTML(node, mode, protectedCount, hintHTML);
  }

  html += footerHTML();
  app.innerHTML = html;
  attachHandlers();
  adjustWheelLabels();
  fitQuoteInput();
  fitAccountButton();
}

/* The motivation line is a <textarea> (an <input> cannot wrap), so its height must follow the
   text: a one-line quote stays one line, a longer one takes the second line instead of being
   cut off. Runs after every render() — including the one right after «Обновить цитату». */
function fitQuoteInput(){
  const el = document.querySelector('.quote-input');
  if(!el || el.tagName !== 'TEXTAREA') return;
  el.style.height = 'auto';
  if(!el.scrollHeight) return; // jsdom / non-layout environment: nothing to measure
  el.style.height = (el.scrollHeight + 2) + 'px';
}

/* Кнопка «Аккаунт» на экране показывает имя/email. На узком
   устройстве длинное имя обрезается (max-width:44vw +
   многоточие), и ширина кнопки — а с ней и привязанное
   меню — «скакает» от длины текста. Если текст обрезан,
   оставляем только иконку: фиксированный квадрат 38 px,
   как в установленном приложении. Обратно к тексту —
   только при изменении ширины (resize ниже). Односторонний
   замер: иконка всегда влезает, поэтому render() сходится
   за один дополнительный проход, без цикла. */
function fitAccountButton(){
  if(!authUser || isStandalonePwa() || accountIconOnly) return;
  const btn = document.getElementById('btnAccount');
  if(!btn || !btn.clientWidth) return; // jsdom / non-layout environment
  if(btn.scrollWidth > btn.clientWidth + 1){
    accountIconOnly = true;
    render();
  }
}
let accountResizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(accountResizeTimer);
  accountResizeTimer = setTimeout(()=>{
    if(!accountIconOnly) return;
    // Ширина изменилась — замерим заново: влезло — вернём
    // текст, всё ещё нет — fitAccountButton снова поставит иконку.
    accountIconOnly = false;
    render();
  }, 200);
});

// tests deliberately poke non-numeric values into the panel flags).
function wishCardAt(idx){
  return (Number.isInteger(idx) && idx >= 0 && Array.isArray(state.wishMap)) ? (state.wishMap[idx] || null) : null;
}
// Moves a card to another slot in the manager. Both arguments are STATE indices; the slot is
// measured in DISPLAY order (that is the order the owner actually sees) and the card TAKES that
// slot, pushing the rest aside. The board renders in ARRAY order (with the personal photo pinned
// first), so the card has to move inside `state.wishMap` itself — renumbering the `order` field
// alone would change nothing on screen. The field is renumbered afterwards so it still matches
// the new sequence: it travels to the cloud metadata and the backup as a record of the order.
function wishMoveCardTo(fromIdx, toIdx){
  if(!Array.isArray(state.wishMap)) return false;
  const cards = state.wishMap;
  const n = cards.length;
  if(!Number.isInteger(fromIdx) || !Number.isInteger(toIdx)) return false;
  if(fromIdx < 0 || toIdx < 0 || fromIdx >= n || toIdx >= n) return false;
  if(fromIdx === toIdx) return false;
  const moved = cards.splice(fromIdx, 1)[0];
  if(!moved) return false;
  cards.splice(toIdx, 0, moved);
  cards.forEach((c, i) => { if(c) c.order = i; });
  return true;
}
// ===== Crop + encode for picked images =====
// Geometry of the open crop dialog, all in WISH_IMG_SIZE (720) units: the base scale covers the
// square frame (so zoom ≥ 1 never reveals empty space), pan is clamped so the frame stays filled.
function cropMetrics(){
  const iw = (wishCropImg && (wishCropImg.naturalWidth || wishCropImg.width)) || 1;
  const ih = (wishCropImg && (wishCropImg.naturalHeight || wishCropImg.height)) || 1;
  const base = WISH_IMG_SIZE / Math.min(iw, ih);
  const scale = base * Math.max(1, wishCropZoom);
  const dw = iw * scale;
  const dh = ih * scale;
  const maxOx = Math.max(0, (dw - WISH_IMG_SIZE) / 2);
  const maxOy = Math.max(0, (dh - WISH_IMG_SIZE) / 2);
  const ox = Math.max(-maxOx, Math.min(maxOx, wishCropOx));
  const oy = Math.max(-maxOy, Math.min(maxOy, wishCropOy));
  return { dw, dh, dx: (WISH_IMG_SIZE - dw) / 2 + ox, dy: (WISH_IMG_SIZE - dh) / 2 + oy };
}
// Repositions the preview image inside the square stage (percentages of the stage box).
function drawCrop(){
  const img = document.getElementById('wishCropImg');
  if(!img || !wishCropImg) return;
  const m = cropMetrics();
  img.style.width = (m.dw / WISH_IMG_SIZE * 100) + '%';
  img.style.height = (m.dh / WISH_IMG_SIZE * 100) + '%';
  img.style.left = (m.dx / WISH_IMG_SIZE * 100) + '%';
  img.style.top = (m.dy / WISH_IMG_SIZE * 100) + '%';
}
// Renders exactly the framed area into a WISH_IMG_SIZE square and encodes it as WebP — the
// optimised copy that is stored locally and uploaded to the cloud. The original file is
// never kept. Fallback to JPEG for browsers without canvas WebP encoding.
function applyCrop(){
  const m = cropMetrics();
  const c = document.createElement('canvas');
  c.width = WISH_IMG_SIZE;
  c.height = WISH_IMG_SIZE;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(wishCropImg, m.dx, m.dy, m.dw, m.dh);
  let out = '';
  try{ out = c.toDataURL('image/webp', 0.82); }catch(e){ out = ''; }
  if(!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', 0.82);
  return out;
}
function closeCrop(){
  wishCropSrc = null;
  wishCropImg = null;
  wishCropZoom = 1;
  wishCropOx = 0;
  wishCropOy = 0;
}

/* Deep-copies one template goal definition into a real goal node. Containers
   keep nesting; the deepest level becomes plain leaf goals. */
function templateNode(def){
  if(!def.children || !def.children.length){
    return { name: def.name, date:"", done:false, children:[] };
  }
  return { name: def.name, children: def.children.map(templateNode) };
}
/* Имя для сравнения шаблонов: обрезаем края и игнорируем регистр (ТЗ п.6). Существующие
   записи НЕ переименовываются — сравнение идёт по этой нормализованной форме, но в state
   уходит имя ровно как в шаблоне/как уже есть у пользователя. */
function templateNameKey(name){
  return String(name == null ? '' : name).trim().toLowerCase();
}
/* Единый план применения выбранных шаблонов (п.6): то, что РЕАЛЬНО произойдёт, с учётом
   лимита 10 сфер и уже существующих данных. Preview и подтверждение используют ОДИН и тот
   же план, поэтому в списке никогда не показывается больше, чем добавится на самом деле,
   и нет молчаливого частичного добавления. Для каждой сферы шаблона:
     merge  — сфера с таким именем уже есть (края/регистр игнорируются): неповторяющиеся
              цели добавятся к ней, повторы помечаются added:false (пропущены, не дубль).
     create — такой сферы ещё нет и лимит 10 не достигнут: сфера создаётся целиком.
     skip   — лимит 10 сфер достигнут и сферы с таким именем нет: она НЕ добавится (видно
              в preview и в результате, а не теряется молча). */
function planTemplates(){
  const spheres = [];
  const counts = { created: 0, merged: 0, goalsAdded: 0, skippedSpheres: 0 };
  const sphereByName = new Map();
  const goalsBySphere = new Map();
  state.children.forEach(s => {
    if(s && !s.archived){
      sphereByName.set(templateNameKey(s.name), s);
      goalsBySphere.set(templateNameKey(s.name), new Set((s.children||[]).map(g => templateNameKey(g && g.name))));
    }
  });
  let activeCount = state.children.filter(s => s && !s.archived).length;
  for(const id of Array.from(selectedTemplates)){
    const tmpl = TEMPLATES[id];
    if(!tmpl) continue;
    for(const sphereDef of tmpl.spheres){
      const key = templateNameKey(sphereDef.name);
      const existing = sphereByName.get(key);
      if(existing){
        const have = goalsBySphere.get(key);
        const goals = sphereDef.goals.map(g => {
          const gk = templateNameKey(g.name);
          const added = !have.has(gk);
          if(added){ have.add(gk); counts.goalsAdded++; }
          return { def: g, name: g.name, added };
        });
        counts.merged++;
        spheres.push({ name: sphereDef.name, status: 'merge', goals });
      }else if(activeCount < 10){
        activeCount++;
        const have = new Set();
        const goals = sphereDef.goals.map(g => {
          have.add(templateNameKey(g.name));
          counts.goalsAdded++;
          return { def: g, name: g.name, added: true };
        });
        counts.created++;
        sphereByName.set(key, { name: sphereDef.name });
        goalsBySphere.set(key, have);
        spheres.push({ name: sphereDef.name, status: 'create', goals });
      }else{
        counts.skippedSpheres++;
        spheres.push({ name: sphereDef.name, status: 'skip',
          goals: sphereDef.goals.map(g => ({ def: g, name: g.name, added: false })) });
      }
    }
  }
  return { spheres, counts };
}
/* Builds the preview list HTML for the selected templates from the SAME plan the confirm
   button runs (planTemplates), so what the user sees is exactly what will happen: new sphere,
   merge into an existing one, or «skipped — 10-sphere limit». Goals that already exist are
   marked as skipped, not silently counted as additions. */
function templatesPreviewHTML(){
  const plan = planTemplates();
  let html = '';
  for(const s of plan.spheres){
    let note = '';
    if(s.status === 'merge') note = ` <span class="template-merge-note">${esc(t('sphereExistsMerge'))}</span>`;
    else if(s.status === 'create') note = ` <span class="template-merge-note">${esc(t('templateWillCreate'))}</span>`;
    else if(s.status === 'skip') note = ` <span class="template-merge-note">${esc(t('templateSkippedCap'))}</span>`;
    html += `<li>${esc(s.name)}${note}<ul>`;
    for(const g of s.goals){
      const gnote = g.added ? '' : ` <span class="template-merge-note">${esc(t('templateGoalExists'))}</span>`;
      html += `<li>${esc(g.name)}${gnote}</li>`;
    }
    html += `</ul></li>`;
  }
  return html;
}
/* Live preview under the checkbox list (checkbox toggles don't re-render,
   so the list is patched in place). */
function updateTemplatesPreview(){
  const list = document.getElementById('templatesPreviewList');
  if(list) list.innerHTML = templatesPreviewHTML();
}
/* Applies every selected template using the single shared plan, so preview and reality can
   never diverge. Goals of an existing same-name sphere are merged in (same-name goals skipped
   by the normalized name — no renames, no duplicates), a missing sphere is created whole, a
   sphere over the 10-cap is skipped. Wheel totals grow exactly like manual creation. Returns
   the counts so the caller can report exactly what happened (added / skipped / why). */
function applyTemplates(){
  if(selectedTemplates.size === 0) return null;
  const plan = planTemplates();
  for(const s of plan.spheres){
    if(s.status === 'skip') continue;              // over the cap — never silently added
    let sphere = null, sphereIdx = -1;
    state.children.forEach((node, i)=>{
      if(!sphere && node && !node.archived && templateNameKey(node.name) === templateNameKey(s.name)){ sphere = node; sphereIdx = i; }
    });
    if(sphere){
      let addedLeaves = 0;
      for(const g of s.goals){
        if(!g.added) continue;                     // already present — keep it, skip the duplicate
        const goal = templateNode(g.def);
        addedLeaves += countWheelLeaves(goal, false);
        sphere.children.push(goal);
      }
      if(addedLeaves > 0){
        bumpWheelTotals([sphereIdx], addedLeaves);
        touchSphere(sphere);
      }
    }else{
      const newSphere = { name: s.name, children: s.goals.map(g => templateNode(g.def)) };
      touchSphere(newSphere);
      const leaves = countWheelLeaves(newSphere, false);
      setWheelTotal(newSphere, leaves);
      bumpWheelTotals([], leaves);
      state.children.push(newSphere);
    }
  }
  saveState();
  return plan.counts;
}
// Honest result toast (п.6): exactly what was added and what was skipped, and why. No vague
// «готово», no silent partial add. Lives in document.body like the other soft notices.
function showTemplatesResult(counts){
  if(!counts) return;
  let text;
  const added = counts.created + counts.goalsAdded;
  if(added === 0 && counts.skippedSpheres === 0){
    text = t('templatesResultNone');
  }else{
    text = t('templatesResultAdded').replace('{spheres}', String(counts.created)).replace('{goals}', String(counts.goalsAdded));
    if(counts.skippedSpheres > 0){
      text += ' ' + t('templatesResultSkipped').replace('{skipped}', String(counts.skippedSpheres) + ' ' + t('templateSkippedCap'));
    }
  }
  const toast = document.createElement('div');
  toast.className = 'undo-toast';
  const label = document.createElement('span');
  label.textContent = text;
  toast.appendChild(label);
  document.body.appendChild(toast);
  setTimeout(()=>{ if(toast.parentNode) toast.parentNode.removeChild(toast); }, 6000);
}
function closeTemplatesModal(){
  templatesModalOpen = false;
  selectedTemplates.clear();
  render();
}
function attachTemplatesModalHandlers(){
  const btnTemplates = document.getElementById('btnTemplates');
  if(btnTemplates){
    btnTemplates.addEventListener('click', ()=>{
      templatesModalOpen = true;
      selectedTemplates.clear();
      render();
      updateTemplatesPreview();
    });
  }
  const btnTemplatesClose = document.getElementById('btnTemplatesClose');
  if(btnTemplatesClose){
    btnTemplatesClose.addEventListener('click', closeTemplatesModal);
  }
  const btnTemplatesCancel = document.getElementById('btnTemplatesCancel');
  if(btnTemplatesCancel){
    btnTemplatesCancel.addEventListener('click', closeTemplatesModal);
  }
  const templatesOverlay = document.getElementById('templatesOverlay');
  if(templatesOverlay){
    templatesOverlay.addEventListener('click', (e)=>{
      if(e.target === templatesOverlay) closeTemplatesModal();
    });
  }
  document.querySelectorAll('[data-template-id]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = el.dataset.templateId;
      if(el.checked) selectedTemplates.add(id);
      else selectedTemplates.delete(id);
      updateTemplatesPreview();
    });
  });
  const btnTemplatesConfirm = document.getElementById('btnTemplatesConfirm');
  if(btnTemplatesConfirm){
    btnTemplatesConfirm.addEventListener('click', ()=>{

      closeTemplatesModal();
      showTemplatesResult(counts);   // п.6: честный результат — добавлено/пропущено и почему
    });
  }
}

// Shared card wrapper attrs/class for the interaction modes: normal (navigate/toggle),
// 'edit' (rename inline), 'delete' (every item is removable except the protected leading
// positions) and 'addsub' (pick a goal that has no subgoals yet, to add 2 to it).
function cardModeAttrs(node, idx, mode, protectedCount){
  if(mode === 'edit') return { cls:'editable', attrs:'' };
  if(mode === 'delete'){
    return idx >= protectedCount
      ? { cls:'deletable', attrs:`data-delete-idx="${idx}"` }
      : { cls:'locked', attrs:'' };
  }
  if(mode === 'addsub'){
    const eligible = !node.children || node.children.length === 0;
    return eligible
      ? { cls:'selectable', attrs:`data-addsub-idx="${idx}"` }
      : { cls:'locked', attrs:'' };
  }
  if(mode === 'move'){
    // No data-nav here on purpose: while reorder mode is on, a plain tap does nothing — only the
    // press-and-hold-then-drag gesture (see attachDragHandlers) acts on the card. That's what
    // keeps this from colliding with normal browsing taps outside of this mode.
    return { cls:'movable', attrs:`data-drag-idx="${idx}"` };
  }
  if(mode === 'relocate'){
    // Any card can be sent elsewhere, protected or not — relocating doesn't touch the item
    // itself, just where it lives, so there's nothing here worth protecting against.
    return { cls:'selectable', attrs:`data-relocate-idx="${idx}"` };
  }
  return { cls:'', attrs:`data-nav="${idx}"` };
}
function cardModeTitle(node, idx, mode, defaultArrow, protectedCount){
  if(mode === 'edit'){
    return `<input type="text" class="goal-input" data-goal-idx="${idx}" data-original="${esc(node.name)}" value="${esc(node.name)}">`;
  }
  if(mode === 'delete'){
    return `<span>${esc(node.name)}</span><span class="arrow">${idx >= protectedCount ? '🗑' : '🔒'}</span>`;
  }
  if(mode === 'addsub'){
    const eligible = !node.children || node.children.length === 0;
    return `<span>${esc(node.name)}</span><span class="arrow">${eligible ? '➕' : '🔒'}</span>`;
  }
  if(mode === 'move'){
    return `<span>${esc(node.name)}</span><span class="arrow">⠿</span>`;
  }
  if(mode === 'relocate'){
    return `<span>${esc(node.name)}</span><span class="arrow"><i class="ti ti-folder-symlink" aria-hidden="true"></i></span>`;
  }
  return `<span>${esc(node.name)}</span><span class="arrow">${defaultArrow}</span>`;
}

// Home goals ordering for the sort dropdown. Returns {node, idx} pairs — idx is each goal's
// ORIGINAL index in state.children, which cardOrLeafHTML bakes into data-nav / data-drag-idx /
// data-delete-idx (all resolved back against the live array). Sorting only changes display
// order, never the underlying data, so navigation / drag / delete keep hitting the right goal.
// Rules: 'desc'/'asc' sort active goals by completion (computePercent) high→low / low→high;
// 'custom' keeps the stored (drag-reorderable) order. Archived goals ALWAYS sink to the bottom,
// in every mode, so a paused goal never floats up among active ones (and an un-archive brings
// it back to the end of the active group, matching the archive sink in the leaf handler).
function sortHomeGoals(children, sortMode){
  const entries = children.map((node, idx) => ({ node, idx }));
  const archived = entries.filter(e => e.node.archived);
  let active = entries.filter(e => !e.node.archived);
  if(sortMode === 'desc'){
    active = active.sort((a, b) => computePercent(b.node) - computePercent(a.node));
  } else if(sortMode === 'asc'){
    active = active.sort((a, b) => computePercent(a.node) - computePercent(b.node));
  }
  // 'custom' (or anything unknown): leave active in stored order. Ties in desc/asc keep their
  // relative stored order because Array.sort is stable in modern engines.
  return active.concat(archived);
}

    const titleHTML = cardModeTitle(node, idx, mode, defaultArrow, protectedCount);
    return `<div class="card ${finalCls}" ${attrs}>

      <div class="bar"><div style="width:${pct}%; background:${barColor(pct)}"></div></div>

  }
  const pct = computePercent(node);
  const dc = doneCount(node);
  const titleHTML = cardModeTitle(node, idx, mode, '›', protectedCount);
  return `<div class="card ${finalCls}" ${attrs}>
    <div class="title">${titleHTML}</div>
    <div class="sub"><span>${dc} / ${activeChildren(node).length}</span><span>${pct}%</span></div>
    <div class="bar"><div style="width:${pct}%; background:${barColor(pct)}"></div></div>
  </div>`;
}

function polarToCartesian(cx, cy, r, angleDeg){
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function wedgePath(cx, cy, r, startAngle, endAngle){
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
  return `M ${cx} ${cy} L ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x.toFixed(2)} ${end.y.toFixed(2)} Z`;
}
// plain arc (no center point) for text-on-a-path labels. Traces from angleA to angleB; the sweep
// direction is picked automatically (angleA<angleB draws clockwise, angleA>angleB counter-clockwise)
// so that in both cases the local path direction runs left-to-right through the label's midpoint —
// that's what keeps curved text upright instead of rendering mirrored/upside-down at the bottom of the ring.
function arcPath(cx, cy, r, angleA, angleB){
  const p1 = polarToCartesian(cx, cy, r, angleA);
  const p2 = polarToCartesian(cx, cy, r, angleB);
  const delta = angleB - angleA;
  const largeArcFlag = Math.abs(delta) <= 180 ? "0" : "1";
  const sweepFlag = delta >= 0 ? "1" : "0";
  return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${r} ${r} 0 ${largeArcFlag} ${sweepFlag} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
}
// Generalized for any number of sectors (4 on the home page, 5 on subgoal pages, etc).
// Sector i is centered at angle i*(360/n), 0 = top, increasing = clockwise. For sectors whose
// center falls in the upper half (-90..90) the curved label arc runs in increasing-angle order;
// for the lower half it's reversed — both keep the text upright (see arcPath comment).
// Maps a wheel percent to filled ring steps (10 rings = whole tens, always rounded DOWN:
// 92% fills 9 rings, only a true 100% fills all 10). A standalone function (not inline math)
// so tests can pin the rule and regressions can't silently reintroduce rounding up.
function wheelFilledSteps(pct){
  const RING_STEPS = 10;
  return Math.min(RING_STEPS, Math.floor(pct / (100 / RING_STEPS)));
}
function wheelHTML(items, opts){
  opts = opts || {};
  // Интерактивные сектора (главная страница): opts.targets[i] — индекс сферы в state.children,
  // которому соответствует сектор i (activeChildren отфильтровывает архивные, так что номера
  // съезжают — без карты соответствия клик ушёл бы не в ту сферу). opts.activeIdx — раскрытая
  // сейчас сфера: её сектор подсвечивается и получает aria-expanded. Без opts колесо остаётся
  // прежним декоративным (страницы целей).
  const targets = Array.isArray(opts.targets) ? opts.targets : null;
  const activeIdx = Number.isFinite(opts.activeIdx) ? opts.activeIdx : null;
  const interactive = !!targets;
  // Цвета подписей и колец. На экране — переменные темы (--text / --muted). Для печати на белом
  // листе (printWheel) можно передать тёмные оттенки через opts, иначе светлый текст на белом фоне
  // нечитаем (баг: названия сфер пропадали при печати).
  const labelColor = opts.labelColor || 'var(--text)';
  const ringColor = opts.ringColor || 'var(--muted)';
  // На экране подписи рендерятся прижатыми к началу дуги (startOffset 0% / start), а центрирует и
  // подрезает их уже adjustWheelLabels() по реальным замерам в DOM. Для печати этот проход не
  // запускается (узел вне #app), поэтому центр включаем сразу через opts.centerLabels.
  const centerLabels = !!opts.centerLabels;
  const labelStart = centerLabels ? '50%' : '0%';
  const labelAnchor = centerLabels ? 'middle' : 'start';
  const n = items.length;
  if(!n) return '';
  const width = 572, height = 320, cx = 286, cy = 160, maxR = 119;
  const colors = ['#3ecf8e', '#ff6b9d', '#f2b84b', '#5b8cff', '#f28c4b', '#8a7bf2'];
  const curveR = maxR + 20;
  const sectorSpan = 360 / n;
  const labelSpan = Math.min(sectorSpan * 0.85, 80);
  const fontSize = n > 4 ? 15 : 17;
  // Names that don't fit the arc used to get clipped by the SVG textPath itself, which (since the
  // text was centered on the arc) cut off both the start AND the end of the word. Guessing a
  // per-character pixel width isn't reliable enough across fonts/devices, so instead every label
  // is first rendered in full (left-aligned to the arc start) and then adjustWheelLabels() —
  // called right after this HTML is inserted into the page — measures each one for real with the
  // browser's own SVG text APIs: a label that fits gets re-centered, one that doesn't gets
  // trimmed character-by-character from the end only until it fits, with an ellipsis appended.

  let defsInner = '';
  const arcIds = items.map((item, i) => {
    const center = i * sectorSpan;
    const norm = ((center + 180) % 360 + 360) % 360 - 180;
    const isUpper = norm > -90 && norm < 90;
    const half = labelSpan / 2;
    const a1 = isUpper ? center - half : center + half;
    const a2 = isUpper ? center + half : center - half;
    const id = `wheelArc${i}`;
    defsInner += `<path id="${id}" d="${arcPath(cx, cy, curveR, a1, a2)}" fill="none"/>`;
    return id;
  });

  let svg = `<svg viewBox="${opts.viewBox || ('0 0 ' + width + ' ' + height)}" width="100%" style="max-width:580px; height:auto; display:block; margin:0 auto;" role="group" aria-label="${esc(t('balanceWheel'))}" xmlns:xlink="http://www.w3.org/1999/xlink">`;
  svg += `<defs>${defsInner}</defs>`;
  const RING_STEPS = 10;
  items.forEach((item, i) => {
    // Wheel-only metric: how free the sphere is from open leaf goals
    // (sticky totalGoalsAdded minus current incomplete leaves). Card percents elsewhere
    // intentionally keep the old computePercent() averaging.
    const pct = wheelPercent(item);
    // Whole tens, rounded down: 92% fills 9 of 10 rings, only 100% fills all 10.
    const filledSteps = wheelFilledSteps(pct);
    const r = maxR * (filledSteps / RING_STEPS);
    const center = i * sectorSpan;
    const start = center - sectorSpan / 2, end = center + sectorSpan / 2;
    const color = colors[i % colors.length];
    const active = interactive && activeIdx === targets[i];
    if(r > 1){
      // A single item spans the full 360°, which degenerates an SVG arc command (start/end
      // points coincide) into a barely-visible sliver. Draw a plain filled circle instead.
      if(n === 1){
        svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" opacity="0.75" stroke="${color}" stroke-width="1"/>`;
      } else {
        svg += `<path d="${wedgePath(cx, cy, r, start, end)}" fill="${color}" opacity="0.75" stroke="${color}" stroke-width="1"/>`;
      }
    }
    // Rendered in full, left-aligned to the start of the arc for now — adjustWheelLabels() fixes
    // this up for real once the SVG is in the DOM and can be measured (see note above).
    svg += `<text font-size="${fontSize}" font-weight="700" fill="${labelColor}"><textPath href="#${arcIds[i]}" xlink:href="#${arcIds[i]}" startOffset="${labelStart}" text-anchor="${labelAnchor}">${esc(item.name)}</textPath></text>`;
  });
  // Grid rings + radial dividers are drawn on top of the filled wedges.
  for(let lvl = 1; lvl <= RING_STEPS; lvl++){
    const r = maxR * lvl / RING_STEPS;
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${ringColor}" stroke-width="1"/>`;
  }
  if(n > 1){
    for(let i = 0; i < n; i++){
      const boundary = i * sectorSpan + sectorSpan / 2;
      const p = polarToCartesian(cx, cy, maxR, boundary);
      svg += `<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(2)}" y2="${p.y.toFixed(2)}" stroke="${ringColor}" stroke-width="1"/>`;
    }
  }
  svg += `<circle cx="${cx}" cy="${cy}" r="3" fill="${labelColor}"/>`;
  // Интерактивные хит-пути — ПОСЛЕДНИЕ, поверх всех декоративных элементов,
  // чтобы клики/касания не блокировались кольцами и линиями.
  if(interactive){
    items.forEach((item, i) => {
      const center = i * sectorSpan;
      const start = center - sectorSpan / 2, end = center + sectorSpan / 2;
      const active = activeIdx === targets[i];
      const label = active ? t('wheelSectorClose')(item.name) : t('wheelSectorOpen')(item.name);
      const common = `class="wheel-sector-hit${active ? ' is-active' : ''}" data-wheel-sector="${targets[i]}" role="button" tabindex="0" aria-expanded="${active ? 'true' : 'false'}" aria-label="${esc(label)}"`;
      if(n === 1){
        svg += `<circle cx="${cx}" cy="${cy}" r="${maxR}" fill="transparent" ${common}/>`;
      } else {
        svg += `<path d="${wedgePath(cx, cy, maxR, start, end)}" fill="transparent" ${common}/>`;
      }
    });
  }
  svg += `</svg>`;
  return svg;
}
// Balance-wheel labels are rendered full-length and left-aligned in wheelHTML(); this runs right
// after that markup lands in the real DOM and uses the browser's own SVG measurement (not a guess
// at character width) to fix each one up: fits → re-centered on the arc; doesn't fit → trimmed
// character-by-character from the end only (with an ellipsis) until it does.
function adjustWheelLabels(){
  document.querySelectorAll('.wheel-wrap textPath').forEach(tp=>{
    try{
      if(typeof tp.getComputedTextLength !== 'function') return;
      const href = tp.getAttribute('href') || tp.getAttribute('xlink:href');
      if(!href) return;
      const pathEl = document.querySelector(href);
      if(!pathEl || typeof pathEl.getTotalLength !== 'function') return;
      const pathLen = pathEl.getTotalLength();
      if(tp.getComputedTextLength() <= pathLen){
        tp.setAttribute('startOffset', '50%');
        tp.setAttribute('text-anchor', 'middle');
        return;
      }
      let base = tp.textContent;
      while(base.length > 1 && tp.getComputedTextLength() > pathLen){
        base = base.slice(0, -1);
        tp.textContent = base + '…';
      }
    }catch(e){}
  });
}

/* ===== Интерактивное колесо: дерево сферы прямо на главной =====
   Сектор колеса — кнопка: раскрывает дерево своей сферы (одновременно только одну — раскрытие
   новой закрывает предыдущую), повторное нажатие сворачивает. Панель — аккордеон между сеткой
   сфер и самим колесом; закрывается и своей кнопкой «Свернуть», потому что колесо может быть
   свёрнуто (wheelOpen=false) и кнопку-сектор тогда не достать. Никаких saveState/синка: это вид. */
function sphereTreeHTML(sphere, sphereIdx){
  const pct = computePercent(sphere);
  const kids = (sphere.children || []).map((node, idx) => ({ node, idx }));
  // Архивные — в конец списка, тем же правилом, что и остальные списки приложения.
  kids.sort((a, b) => (a.node.archived ? 1 : 0) - (b.node.archived ? 1 : 0));
  const rows = kids.length ? kids.map(({ node, idx }) => {
    const cp = computePercent(node);
    const mark = node.archived ? '<i class="ti ti-folder" aria-hidden="true"></i>'
      : (isLeaf(node) ? (node.checklist ? '<i class="ti ti-list-check" aria-hidden="true"></i>' : (node.done ? '✅' : '❌')) : '›');
    return `<button type="button" class="sphere-tree-item${node.archived ? ' archived' : ''}" data-tree-nav="${sphereIdx}:${idx}">
        <span class="sphere-tree-item-mark">${mark}</span>
        <span class="sphere-tree-item-name">${esc(node.name)}</span>
        <span class="sphere-tree-item-pct">${cp}%</span>
        <span class="sphere-tree-item-bar"><span style="width:${cp}%; background:${barColor(cp)}"></span></span>
      </button>`;
  }).join('') : `<div class="sphere-tree-empty">${t('sphereTreeEmpty')}</div>
      <button type="button" class="sphere-tree-open-page" data-sphere-open="${sphereIdx}">${t('sphereTreeOpenPage')}</button>`;
  return `<div class="sphere-tree" id="sphereTreePanel" data-sphere-tree="${sphereIdx}">
      <div class="sphere-tree-head">
        <span class="sphere-tree-arrow" aria-hidden="true">▾</span>
        <span class="sphere-tree-name">${esc(sphere.name)}</span>
        <span class="sphere-tree-pct">${pct}%</span>
        <button type="button" id="btnSphereTreeClose" class="sphere-tree-close">${t('sphereTreeClose')}</button>
      </div>
      <div class="sphere-tree-list">${rows}</div>
    </div>`;
}
function toggleSphereTree(idx){
  const sphere = state.children[idx];
  if(!sphere) return;
  const opening = expandedSphereIdx !== idx;
  // Только вид: expandedSphereIdx живёт вне state. Но РАСКРЫТИЕ сектора —
  // осознанное открытие сферы: дата взаимодействия обновляется и сохраняется
  // (синхронизируется). Сворачивание — не посещение, ничего не трогаем.
  expandedSphereIdx = opening ? idx : null;
  if(opening){
    // v1.2.0: «Важные сферы жизни» свёрнуты по умолчанию, а дерево сферы рендерится
    // ВНУТРИ этой секции — без раскрытия клик по сектору колеса выглядел бы как «ничего
    // не произошло». Открытие сектора раскрывает и секцию (state — тоже сохранится).
    if(!mainGoalsOpen){
      mainGoalsOpen = true;
      state.mainGoalsOpen = true;
    }
    touchSphere(sphere);
    saveState();
  }
  render();
  // Прокрутка — только при РАСКРЫТИИ: сворачивание не должно дёргать страницу.
  if(expandedSphereIdx !== null) scrollSphereTreeIntoView();
}
/* Плавная прокрутка к РАСКРЫВАЕМОМУ модулю — панели дерева сферы — так, чтобы она
   прижалась к верху экрана (жалоба владельца: «вверху экрана — раскрываемый при
   нажатии модуль, а не Важные сферы жизни»; прокрутка к заголовку секции уводила
   колесо за экран). Нулевой зазор: раньше отступ -16px оставлял сверху «небольшую
   часть модуля выше» (хвост сетки карточек) — некрасиво. Панель выше верха не
   поднимается (Math.max с нулём), если дерево уже видно — ничего не прыгает.
   Высота «прилипшей» шапки вычитается, если такая есть (сейчас .topbar статичен,
   но правило будущее — и на случай тем, где шапка фиксирована). */
function scrollSphereTreeIntoView(){
  try{
    const panel = document.getElementById('sphereTreePanel');
    if(!panel) return;
    let headerH = 0;
    const topbar = document.querySelector('.topbar');
    if(topbar){
      const pos = window.getComputedStyle(topbar).position;
      if(pos === 'fixed' || pos === 'sticky') headerH = topbar.offsetHeight || 0;
    }
    const y = panel.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop || 0) - headerH;
    window.scrollTo({ top: Math.max(y, 0), behavior: 'smooth' });
  }catch(e){}
}
// Привязка секторов колеса и элементов панели. Вынесена из attachMainViewHandlers, потому что
// refreshWheel() пересобирает innerHTML колеса (инлайн-переименование карточки) — слушатели
// на секторах после этого надо вернуть.
function attachWheelSectorHandlers(){
  document.querySelectorAll('[data-wheel-sector]').forEach(el=>{
    const idx = parseInt(el.dataset.wheelSector, 10);
    const toggle = (e)=>{
      if(e && e.stopPropagation) e.stopPropagation();
      if(!Number.isFinite(idx)) return;
      toggleSphereTree(idx);
    };
    // Используем только addEventListener — надежнее для SVG в iOS Safari
    el.addEventListener('click', toggle);
    // Клик мышью не должен оставлять фокус на секторе — иначе вокруг SVG
    // рисуется фокусный прямоугольник (репорт владельца). Клавиатура (Tab)
    // фокусирует сектор как обычно — кольцо :focus-visible остаётся.
    el.addEventListener('mousedown', (e)=>{ e.preventDefault(); });
    // iOS Safari: touchend + preventDefault для SVG
    el.addEventListener('touchend', (e)=>{ e.preventDefault(); toggle(e); el.blur(); }, {passive:false});
    el.addEventListener('touchstart', ()=>{}, {passive:true});
    // Клавиатура: роль кнопки + Enter/Space (Space иначе скроллит страницу).
    el.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
        e.preventDefault();
        toggle(e);
      }
    });
  });
  const btnClose = document.getElementById('btnSphereTreeClose');
  if(btnClose){
    btnClose.addEventListener('click', (e)=>{
      e.stopPropagation();
      expandedSphereIdx = null;
      render();
    });
  }
  document.querySelectorAll('[data-tree-nav]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const parts = (el.dataset.treeNav || '').split(':');
      const s = parseInt(parts[0], 10), c = parseInt(parts[1], 10);
      const sphere = state.children[s];
      if(!sphere || !Array.isArray(sphere.children) || !sphere.children[c]) return;
      // Переход внутрь сферы — как тап по карточке внутри неё (data-nav):
      // осознанное открытие, отмечаем взаимодействие и сохраняем дату,
      // чтобы она уехала в облако через обычный механизм синхронизации.
      touchSphereAtPath([s]);
      saveState();
      path = [s, c];
      expandedSphereIdx = null;
      render();
    });
  });
  document.querySelectorAll('[data-sphere-open]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const idx = parseInt(el.dataset.sphereOpen, 10);
      expandedSphereIdx = null;
      openSphereTree(idx);
    });
  });
}

function leafDetailHTML(node){
  // Split out of the ISO "YYYY-MM-DD" string we store. Deliberately rendered as three plain
  // number inputs instead of a single <input type="date"> — the native date input's segmented
  // year editor pads an incomplete/partially-retyped year with leading zeros on blur in several
  // mobile browsers (typing "2022" over an existing year could commit as "0002"). Plain number
  // fields don't have that segment-auto-complete behavior, so this sidesteps the bug entirely.
  const [y, m, d] = (node.date || '').split('-');
  return `<div class="leaf-row ${node.done?'done':''} ${node.archived?'archived':''}">
    <div class="chk ${node.done?'done':''}" id="leafToggle">${node.done?'✓':''}</div>
    <div class="leaf-body">
      <div class="leaf-title-row">

        <div style="display:flex; align-items:center; gap:8px;">
          <button id="btnArchive" class="star-btn ${node.archived?'active':''}" data-tip="${node.archived ? t('tipUnarchive') : t('tipArchive')}" aria-label="${node.archived ? t('tipUnarchive') : t('tipArchive')}"><i class="ti ${node.archived ? 'ti-archive-off' : 'ti-archive'}" aria-hidden="true"></i></button>
          <button id="btnTogglePriority" class="star-btn ${node.priority?'active':''}" data-tip="${node.priority ? t('tipRemovePriority') : t('tipAddPriority')}" aria-label="${node.priority ? t('tipRemovePriority') : t('tipAddPriority')}">${node.priority ? '⭐' : '☆'}</button>
        </div>
      </div>
      <div class="leaf-meta">
        <span>${t('due')}</span>
        <div class="date-fields">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="leafDay" class="date-field date-field-day" placeholder="${t('dateDayPlaceholder')}" value="${esc(d||'')}">
          <span class="date-sep">.</span>
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="leafMonth" class="date-field date-field-month" placeholder="${t('dateMonthPlaceholder')}" value="${esc(m||'')}">
          <span class="date-sep">.</span>
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="leafYear" class="date-field date-field-year" placeholder="${t('dateYearPlaceholder')}" value="${esc(y||'')}">
        </div>
        ${node.date ? `<button id="btnClearDate" title="${t('tipClearDate')}" aria-label="${t('tipClearDate')}">✕</button>` : ''}
      </div>
      <span id="priorityMsg" class="add-goal-msg"></span>
